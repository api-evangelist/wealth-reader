method: searched
source: >-
  https://github.com/Wealth-Reader/allwr-toolkit ;
  https://raw.githubusercontent.com/Wealth-Reader/allwr-toolkit/main/docs/mcp.md ;
  https://raw.githubusercontent.com/Wealth-Reader/allwr-toolkit/main/docs/cli.md ;

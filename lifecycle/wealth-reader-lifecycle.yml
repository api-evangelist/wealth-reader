    note: DNS does not resolve (NXDOMAIN), probed 2026-09-03
  no_status_pointer_reason: >-
    No StatusPage pointer is emitted in apis.yml. There is no status page. This matters more than
    usual for this product: POST /entities/ is a synchronous live bank navigation, and error codes
    3000 ("Entity under maintenance"), 3001 ("Execution time exceeded") and 3002 ("Connection with
    the entity is under maintenance") are per-institution availability facts an integrator has no
    way to see in advance. Per-connector status is the single most useful page this provider does
    not publish.

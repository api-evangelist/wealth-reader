  fatal: false
  cause: An error not covered by the other error codes
  remediation: Open a ticket stating the value of statistics.SESSION
- code: 2
  title: Incorrect call
  fatal: false
  cause: Some of the required parameters were not sent, were sent in an incorrect format, a usage limit

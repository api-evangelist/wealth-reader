  remediation: The text received in "message" will detail the reason for the error. For example, "The
    parameter 'api_key' is required"
- code: 3
  title: Blocked token
  fatal: true
  cause: The token has been blocked, due to a fatal error (For example, invalid credentials, when the
    user has changed them)
  remediation: You must generate a new token
- code: 4
  title: Temporarily invalid token
  fatal: false
  cause: A two-factor challenge or a temporary error requires generating a new token, but it is not a

source: https://api.wealthreader.com/error-codes/?lang=en and https://api.wealthreader.com/warning-codes/?lang=en
  (both HTTP 200, fetched 2026-09-03); cross-read against https://github.com/Wealth-Reader/wealthreader-api-docs/blob/main/api-reference/error-codes.md
format: custom
format_note: 'NOT RFC 9457. Every response carries the same envelope: {success: bool, payload: [...],
  error: {code, message}, statistics: {SESSION, execution_time, warnings[]}}. The media type is application/json,
  never application/problem+json. The HTTP status is a poor signal here — a failed read commonly returns
  HTTP 200 with success:false and an error.code; the machine-readable decision lives in error.code and
  its `fatal` flag, not in the status line.'
envelope:
  success: boolean
  error.code: integer
  error.message: localized string (?lang=en for English, Spanish by default)
  statistics.SESSION: session id — always store it; support cannot reproduce a case without it
  statistics.warnings: array of non-fatal warning objects, see warning_codes below
retry_rule: '`fatal: true` means the call will fail again with the same input — surface it and stop. For
  credential errors, retrying walks the end user towards a locked account at their bank. `fatal: false`
  is transient: back off and retry, or let the next scheduled run pick it up.'
http_statuses_declared:

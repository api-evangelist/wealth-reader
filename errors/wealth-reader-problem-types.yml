string_codes:
- code: rate_limited
  http: 429
  operation: cardsEnrollmentsCreate
  meaning: More than 60 calls to POST /cards/enrollments/ for this api_key in 60 seconds.
- code: invalid_email
  http: 400
  operation: cardsEnrollmentsCreate
  meaning: email or ttl_minutes failed validation.
- code: blocked_host
  http: null
  operation: cards webhook delivery
  meaning: The registered webhook_url resolved to a private, loopback, link-local, CGNAT, multicast or
    reserved address at delivery time (DNS rebinding check). Recorded as the delivery response_excerpt;
    the delivery is closed as failed.
note: The Cards (real time) tag uses a SECOND, incompatible error shape — string codes such as rate_limited
  and invalid_email in a {success, code, message} body with a real HTTP status — while the rest of the
  API uses integer codes in the {success, error:{code,message}} envelope. A client has to handle both.

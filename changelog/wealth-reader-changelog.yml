api_changelog:
  published: false
  note: >-
    Wealth Reader publishes NO dated changelog for the bank-aggregation API. The specification
    carries a semver version (8.1.7) and the docs repo carries git history, but there is no page
    or file that says what changed between versions, when, or whether it was breaking. A major
    number of 8 means a lot has changed; none of it is narrated. This is the clearest operational
    gap in an otherwise well-documented surface.
  scheme: semver
  current_version: 8.1.7
  version_source: info.version of the published OpenAPI
  substitutes:
  - surface: https://github.com/Wealth-Reader/wealthreader-api-docs
    detail: >-
      The docs and both OpenAPI documents are mirrored to a public repo, so a diligent consumer can
      diff commits to reconstruct changes. That is a workaround, not a changelog.

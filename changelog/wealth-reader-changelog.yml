    - >-
      Typed ALL WR Tasks import-mode API client — retries with backoff and jitter, Retry-After
      support, idempotency keys, correlation ids, redacted logging.
    - Connector SDK with entry-point plugin discovery.
    - >-
      Asana importer (beta): offline export mode and live API mode, curated GID selection manifest,
      rich-subtask vs checklist distinction, GID preservation.
    - >-
      Freshdesk importer (beta): tickets, conversations with private notes kept private, contacts,
      companies, streamed attachments, HTML sanitization.
    - >-
      allwr-toolkit CLI: doctor, connectors, migrate inspect/plan/apply,
      migration status/resume/cancel/report/cleanup-plan, mcp serve; JSON output and meaningful
      exit codes; dry-run by default.
    - >-
      MCP server (alpha): read and planning tools by default; mutating tools only with
      ALLWR_MCP_ALLOW_WRITES=true; apply requires a verified plan.
    - Full test suite (unit, contract, integration), quality tooling, CI/security workflows, documentation and governance files.
    highlights: First public cut of the toolkit. Nothing released to a registry yet.

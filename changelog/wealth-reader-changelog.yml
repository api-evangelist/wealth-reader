  current_release: none
  entries:
  - version: Unreleased
    date: null
    breaking: []
    additions:
    - >-
      Migration core: canonical model, configuration-driven mapping, plan/apply lifecycle with
      SHA-256 plan verification, SQLite checkpoint state with resume, idempotent execution,

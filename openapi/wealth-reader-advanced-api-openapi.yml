            type: string
            example: EUR
          principal:
            type: number
            description: Contracted nominal amount
            example: 10000
          pending_principal:
            type: number
            description: Remaining nominal amount to be repaid
            example: 5000
          start_date:
            type: string
            format: date
            example: '2024-09-01'
          maturity_date:
            type: string
            format: date
            example: '2025-09-01'

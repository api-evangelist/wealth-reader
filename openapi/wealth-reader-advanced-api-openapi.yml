      - price
      - total_amount
      - currency
      properties:
        uuid:
          type: string
          description: Unique identifier, in relation to the portfolio uuid, assigned by Wealth Reader
          example: 05e4563f5bbf2d06efd0a29ebe7edbbb4e1bff63
        operation_pending:
          type: boolean
          description: Indicates whether the operation is pending execution or not.
          example: false

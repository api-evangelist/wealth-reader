          type:
          - string
          - 'null'
          format: date
          example: '2020-01-30'
        value_date:
          type: string
          format: date
          example: '2020-01-30'
        operation_type:
          type: string
          enum:
          - purchase
          - sale
          - subscription by transfer
          - redemption by transfer
          - scrip dividend
          - capital increase
          - equity rights
          - equity fee
          - equity adjustment
          example: purchase
        shares:
          type: number
          example: 1076.8273
        price:
          type: number
          example: 11.1438
        total_amount:
          type: number

    batch-connection:
      type: object
      description: 'Structure of each connection in the array - accepts all parameters from the /entities/ method

        Must always send credential_id + code + (token OR credentials)

        '
      required:
      - credential_id
      - code
      properties:
        credential_id:
          type: string
          description: Client's unique identifier for this credential
          example: cred_001
        code:
          type: string
          description: Name of the entity. The complete list is available with GET /entities/
          example: santander
        token:
          type: string
          description: 'Value for custodied credentials, previously tokenized through a call

            with tokenize=true. Alternative to user/password.

            '
          example: FRJ0mHlaqZwLzu
        user:
          type: string
          description: User (required if token is not sent)
        password:
          type: string
          description: Password (required if token is not sent)
        product_types:
          type: string
          description: 'List of product types from which information is to be retrieved.

            Accepts multiple values separated by commas. Default value is ALL.

            '
          example: accounts,cards,portfolios
        only_balances:
          type: boolean
          default: false
          description: 'Indicates whether to obtain only the balances of the products

            instead of all available information

            '
        date_from:
          type: string
          format: date
          description: 'Date from which transactions are requested, in YYYY-MM-DD format.

            Must be a date before today.

            '
          example: '2024-01-01'
        date_to:
          type: string
          format: date
          description: Only applies to restricting by future dates for loan and confirming products, in YYYY-MM-DD format. The date must be later than today.
          example: '2025-12-31'
        required_products_schema:
          type: string
          description: Required products schema. Indicates the specific accounts or cards from which data is desired, with additional per-product configurations (only_balances, add_pdf_from_uuids, date_from). Accepts a JSON string.
          example: '{"ACCOUNTS":{"0ae4d722b1c82feeafb4b36b2893230444071335":{"only_balances":false,"date_from":"2024-04-03"}}}'
        add_pdf_from_uuids:
          type: string
          description: Accepts transaction UUIDs separated by commas. Only taken into account if product_types is ALL or includes accounts. Adds the PDF document associated with each requested bank transaction.
          example: 20966426721d0885ef9d4b95535e1d3198936f16,8772d6c978d37d7af83094abf380b8b703e94105
        force_historic_transactions:
          type: boolean
          default: false
          description: If true, forces retrieval of the full transaction history available at the entity, ignoring the date_from filter.
        second_password:
          type: string
          description: Second password or security answer, required by some entities in addition to the main password.
        third_password:
          type: string
          description: Third credential field required by some entities (e.g. PIN, card number).
        contract_name:
          type: string
          description: Contract or account alias required by some entities to identify a specific contract within a multi-contract access.
    revoke-user-request:
      type: object
      required:
      - api_key
      - user_id
      - service
      properties:
        api_key:
          type: string
          description: Authentication key (8 alphanumeric characters)
          example: A1B2C3D4
        user_id:
          type: string
          description: User identification document.
          example: 12345678A
        service:
          type: string
          enum:
          - integra
          - easy-transfer
          - all
          description: Service from which to unregister the user. 'all' for all services.
          example: easy-transfer
    portfolio_composition_bonds_item:
      type: object
      properties:
        ISIN:
          type:
          - string
          - 'null'
          description: Instrument ISIN
          example: DE000BU0E139
        ISIN_description:
          type:
          - string
          - 'null'
          description: Instrument description
          example: Federal Republic of Germany 02024-15.01.2025 Certificate of Deposit
        currency:
          type:
          - string
          - 'null'
          description: Currency in ISO 4217 coding
          example: EUR
        price:
          type:
          - number
          - 'null'
          description: Market price
          example: 0.988945
        shares:
          type:
          - number
          - 'null'
          description: Quantity / nominal
          example: 247000
        total_amount:
          type:
          - number
          - 'null'
          description: Total nominal value / total amount
          example: 244269.42
        interest_rate:
          type:
          - number
          - 'null'
          description: Coupon rate
          example: 0.5
        issue_date:
          type:
          - string
          - 'null'
          format: date
          description: Issue date
          example: '2024-01-15'
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: Maturity date
          example: '2025-01-15'
        risk_rating:
          type:
          - string
          - 'null'
          description: Credit rating
          example: AAA
        effective_yield:
          type:
          - number
          - 'null'
          description: Effective yield
          example: 3.12
        immediate_yield:
          type:
          - number
          - 'null'
          description: Immediate yield
          example: 3.05
        reference_currency:
          type:
          - string
          - 'null'
          description: When currency differs from reference_currency, indicates the reference currency used for conversion
          example: EUR
        exchange_rate:
          type:
          - number
          - 'null'
          description: Exchange rate applied from currency to reference_currency
          example: 1
    statistics:
      type: object
      required:
      - SESSION
      - execution_time
      properties:
        SESSION:
          type: string
          example: 3463754e3540884
          description: Always save this value, whether the connection is correct or not. It is necessary to obtain support
        execution_time:
          type: number
          example: 0.958119869232178
          description: Duration of execution
        warnings:
          type: array
          description: Indicates warnings, not problems, found during information extraction. It is relevant to store them to improve support
          items:
            type: object
            properties:
              code:
                type: integer
                format: unsigned
                example: 1000
                description: You can get the complete list in the error-codes method.
              message:
                type: string
                example: No contracted funds
                description: Text describing the warning
              product_type:
                type: string
                example: portfolios
                enum:
                - user_information
                - accounts
                - portfolios
                - cards
                - receipts
                - loans
                - deposits
                - leases
                - insurances
                - factoring
                - confirming
                - properties
                - invoices
                - files
                - contracts
                - unknown
                description: When retrieving what type of product the warning has been generated for
        operation_id:
          type: string
          example: 1827C79229
          description: 'The value will be indicated when the API has been invoked through the Widget provided by Wealth Reader. To learn more about this type of integration, visit: https://docs-en.wealthreader.com/'
        token:
          type: string
          example: FRJ0mHlaqZwLzu
          description: The value is indicated when credentials are tokenized for the first time
    factoring:
      type: array
      items:
        type: object
        description: Factoring contracts
        properties:
          uuid:
            type: string
            example: a62ae601a424403d0fbe968d335378421006c277
          contract_number:
            type: string
            example: '000117001234567'
          name:
            type: string
            example: FACTORING PPAL SIN RECURSO
          assignor_id:
            type: string
            description: Assignor tax identification number (NIF)
            example: B12345678
          assignor:
            type: string
            description: Assignor name. The user or company that sells invoices to obtain liquidity.
            example: QUICKSILVER DISTRIBUCION Y LOGISTICA SL
          assignor_type:
            type: string
            description: Type of factoring agreement
            enum:
            - non-recourse-factor
            - recourse-factor
            example: non-recourse-factor
          assignee:
            type: string
            description: Assignee name. The banking or financial institution that acquires the collection rights.
            example: Banco Sabadell
          currency:
            type: string
            example: EUR
          balances:
            type: object
            properties:
              available:
                type: number
                example: 11360.26
              disposed:
                type: number
                example: 0
              limit:
                type: number
                example: 11360.26
          interest_rate:
            type: number
            example: 5.25
          linked_account:
            type: string
            description: IBAN code without spaces. The value will be null when the entity does not provide it.
            example: ES0700812345678987654321
          next_payment_date:
            type: string
            example: ''
          number_invoices:
            type: integer
            example: 8
          total_value:
            type: number
            description: Total value of invoices
            example: 14495.28
          total_advanced_value:
            type: number
            description: Total advanced value
            example: 6919.29
          clients:
            type: array
            description: List of clients associated with the factoring contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the client
                  example: 2ea19f8f8bcda4fa5e54e139852e0a7459d16b49
                client_id:
                  type: string
                  description: Client tax identification number
                  example: A12345678
                client_name:
                  type: string
                  description: Client name
                  example: EMPRESA 1 SA
                limit:
                  type: number
                  description: Credit limit for the client
                  example: 50000
                disposed:
                  type: number
                  description: Amount disposed/used by the client
                  example: 15000
                available:
                  type: number
                  description: Available credit for the client
                  example: 35000
                payment_method:
                  type: string
                  description: Payment method for the client
                  enum:
                  - bank-check
                  - check
                  - domiciled_bill
                  - accepted_domiciled_bill
                  - non_domiciled_bill
                  - accepted_non_domiciled_bill
                  - non_order_promissory_note
                  - order_promissory_note
                  - accepted_receipt
                  - domiciled_receipt
                  - non_domiciled_receipt
                  - transfer_payment
                  example: transfer_payment
                payment_deadline:
                  type: integer
                  description: Payment deadline in days
                  example: 30
          invoices:
            type: array
            description: List of invoices associated with the factoring contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the invoice
                  example: 6b556584df0721e5f0b27448247c9682a6470d11
                invoice_id:
                  type: string
                  description: Invoice number or reference
                  example: 2023-53
                client_id:
                  type: string
                  description: Client tax identification number
                  example: A12345678
                operation_date:
                  type: string
                  format: date
                  description: Date when the invoice was factored
                  example: '2023-10-25'
                due_date:
                  type: string
                  format: date
                  description: Invoice due date
                  example: '2024-01-24'
                payment_date:
                  type: string
                  format: date
                  description: Date when the invoice was paid
                  example: '2024-01-20'
                invoice_amount:
                  type: number
                  description: Invoice amount
                  example: 918.45
                received_amount:
                  type: number
                  description: Amount received/advanced
                  example: 873.53
                status:
                  type: string
                  description: Invoice status
                  enum:
                  - cancelled
                  - disputed
                  - funded
                  - pending_collection
                  - prefinancing
                  - overdue
                  example: funded
                additional_info:
                  $ref: '#/components/schemas/additional_info'
          transactions:
            type: array
            description: List of transactions associated with the factoring contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the transaction
                  example: 8a3b5c7d9e1f2a4b6c8d0e2f4a6b8c0d2e4f6a8b
                operation_date:
                  type: string
                  format: date
                  description: Date when the transaction was executed
                  example: '2023-10-25'
                value_date:
                  type: string
                  format: date
                  description: Value date of the transaction
                  example: '2023-10-26'
                amount:
                  type: number
                  description: Transaction amount
                  example: 1500
                currency:
                  type: string
                  description: Transaction currency
                  example: EUR
                description:
                  type: string
                  description: Transaction description
                  example: ANTICIPO FACTURA 2023-53
    entities:
      type: object
      required:
      - code
      - name
      - logo
      - color
      - inputs
      - statistics
      properties:
        code:
          type: string
          example: bancamarch
          description: The institution code
        name:
          type: string
          example: Bancamarch
          description: The institution name
        logo:
          type: string
          example: https://cdn.wealthreader.com/bancamarch.svg
          description: Logo
        color:
          type: string
          example: '#e23e4d'
          description: Predominant color in the logo
        inputs:
          type: object
          properties:
            document_type:
              type: object
              properties:
                required:
                  type: boolean
                  example: false
                  description: Indicates if the field is required
                name:
                  type: string
                  example: DNI;Pasaporte
                  description: Field name. Since the 'document type' field is a dropdown list, this string is a semicolon-separated list of values
            user:
              type: object
              properties:
                required:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Username
            password:
              type: object
              properties:
                required:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Access key
        statistics:
          $ref: '#/components/schemas/statistics'

            items:
              type: object
              required:
              - date
              - currency
              - gross_interest
              properties:
                uuid:
                  type: string
                  description: Unique identifier, in relation to the deposit
                  example: 90763109952d4f2ebece8dceca8254078c5384a0
                scheduled:
                  type: boolean
                  description: true if scheduled (future), false if already paid
                  example: false
                date:
                  type: string
                  format: date
                  example: '2025-09-01'
                period_start:
                  type: string
                  format: date
                  description: Start of the period to which the coupon/interest corresponds
                  example: '2024-09-01'
                period_end:
                  type: string
                  format: date
                  example: '2025-09-01'
                currency:
                  type: string
                  example: EUR
                gross_interest:
                  type: number
                  example: 300
                withholding_tax:
                  type: number
                  example: 57
                net_interest:
                  type: number
                  example: 243
                payment_type:
                  type: string
                  enum:
                  - coupon
                  - maturity
                  example: maturity
          principal_movements:
            type: array
            description: Principal movements - opening, renewal, cancellation, reimbursement
            items:
              type: object

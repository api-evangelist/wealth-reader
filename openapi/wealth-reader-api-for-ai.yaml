        type: object
        description: Bank accounts
        required:
          - uuid
          - code
          - name
          - currency
          - owners
          - balances
          - transactions
        properties:
          uuid:
            type: string
            example: 8076932f04f73e27fe608fee4d12fca8708dec8c
          subtype:
            type: string
            enum:
              - checking
              - savings
              - line-of-credit
            example: checking
          interest_rate:
            type: number
            nullable: true
            example: 0.5
            description: Account interest rate, if applicable.
          line_of_credit_details:
            type: object
            description: >-
              Specific details for line of credit accounts. Only available when
              subtype is line-of-credit
            nullable: true
            properties:
              credit_limit:
                type: number
                nullable: true
                example: 50000
                description: Credit limit
              interest_rate:
                type: number
                nullable: true
                example: 4.5
                description: Interest rate for the credit line
              credit_used:
                type: number
                example: 15000
                description: Credit used
              credit_available:
                type: number
                nullable: true
                example: 35000
                description: Available credit
              constitution_date:
                type: string
                format: date
                nullable: true
                example: '2021-05-20'
                description: Date when the credit line was constituted
              expiration_date:
                type: string
                format: date
                nullable: true
                example: '2031-05-20'
                description: Expiration date of the credit line
          code:
            type: string
            description: IBAN code without spaces
            example: ES4914651234561234567890
          name:
            type: string
            example: Cuenta NÓMINA
          currency:
            type: string
            example: EUR
          owners:
            $ref: '#/components/schemas/owners'
          balances:
            type: object
            properties:
              available:
                type: number
                example: 14302.07
              current:
                type: number
                example: 14302.07
          additional_info:
            $ref: '#/components/schemas/additional_info'
          transactions:
            type: array
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: >-
                    Unique identifier, in relation to the account uuid, assigned
                    by Wealth Reader
                  example: d0c2ea4c072cf4d7b0fd494d7728260d736e6b25
                operation_date:
                  type: string
                  format: date
                  example: '2022-12-30'
                value_date:
                  type: string
                  format: date
                  example: '2022-12-30'
                amount:
                  type: number
                  example: -1.1
                balance:
                  type: number
                  example: 14302.07
                description:
                  type: string
                  example: Pago en TELPARK MADRID ES
                pdf_file:
                  type: string
                  description: >-
                    PDF file encoded in Base64 if requested via the
                    add_pdf_from_uuids parameter
                pdf_file_settled:
                  type: boolean
                  description: >-
                    Indicates whether the file generated by the bank is final
                    (true) or provisional (false)
                categorization:
                  type: object
                  description: Optional categorization information
                  x-nullable: true
                  properties:
                    type:
                      type: integer
                      example: 1
                      description: >-
                        The complete list of categories can be obtained from the
                        /entities/category-types/ method
                    portfolio-uuid:
                      type: string
                      x-nullable: true
                      example: '1465010091400123456789'
                    ISIN:
                      type: string
                      x-nullable: true
                      example: US88160R1014
                transfer_details:
                  type: object
                  x-nullable: true
                  description: >-
                    This data only appears when the transaction is a transfer.
                    If it is a transfer and this information does not appear,
                    but it does appear in online banking, you can open a ticket
                    to have it added.
                  properties:
                    concept:
                      type: string
                      description: Concept written by the sender or issuer
                      example: Pago de factura 12345
                    sender_receiver:
                      type: string
                      description: Name of the sender or recipient
                      example: Juan Pérez
                    account_number:
                      type: string
                      description: Account number of the sender or recipient
                      example: ESXX12341234121234567890
                additional_info:
                  $ref: '#/components/schemas/additional_info'
    cards:
      type: array
      items:
        type: object
        description: Credit, debit, and prepaid cards
        required:
          - subtype
          - uuid
          - code
          - name

                example: 4.25
              apr_tae:
                type: number
                description: APR/TAE if the entity publishes it
                example: 4.38
              discount_rate:
                type: number
                description: Discount rate (IFRS 16), if available
              initial_fee:
                type: number
                description: Down payment/initial fee
                example: 3000
              security_deposit:
                type: number
                description: Security deposit if exists
                example: 1000
              residual_value:
                type: number
                description: Residual value/purchase option (typical in leasing)
                example: 12000
              purchase_option:
                type: boolean
                description: Purchase option exists at the end
                example: true
              services_included:
                type: object
                description: More common in renting
                properties:
                  maintenance:
                    type: boolean
                    example: true
                  insurance:
                    type: boolean
                    example: true
                  roadside_assistance:
                    type: boolean
                    example: true
                  tires:
                    type: boolean
                    example: false
              vat_included:
                type: boolean
                description: Fees with VAT included (renting) vs itemized (leasing)
                example: true
              mileage_limit_year:
                type: integer
                description: Annual mileage limit (vehicle renting)
                example: 15000
              early_termination:
                type: object
                description: Early termination conditions
                properties:
                  allowed:
                    type: boolean
                    example: true
                  penalty_type:
                    type: string

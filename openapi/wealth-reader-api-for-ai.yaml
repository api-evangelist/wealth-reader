              - debit
              - prepaid
            example: credit
          uuid:
            type: string
            example: aefd89eade0a6a09d9b8eab4c22da6a6a37632e6
          code:
            type: string
            description: Numbering with PCI compliance obfuscation
            example: 516097********1234
          name:
            type: string
            example: Credit Card
          currency:
            type: string
            example: EUR
          next_payment_date:
            type: string
            format: date
            description: Next payment date for credit cards
            example: '2023-01-05'
          anual_interest:
            type: number
            description: Annual interest rate
            example: 17.48
          tae:
            type: number
            description: Annual Equivalent Rate (APR)
            example: 18.95
          balances:
            type: object
            properties:
              available:
                type: number
                example: 3980
              limit:
                type: number
                example: 4000
              disposed:
                type: number
                example: 20
          linked_account:
            type: string
            example: ES4021005321592566566159
          owner:
            $ref: '#/components/schemas/owners'
          additional_info:
            $ref: '#/components/schemas/additional_info'
          transactions:
            type: array
            items:
              type: object
              required:
                - uuid
                - value_date
                - amount
                - description
              properties:
                uuid:
                  type: string
                  example: 78ceedca9cd9d2f2bfbb2439795ab6a1fcefc12b
                settled:
                  type: boolean
                  description: >-
                    Indicates whether it is a transaction settled by the bank,
                    which means it will not change in subsequent readings.
                  example: false
                operation_date:
                  type: string
                  format: date
                  description: Transaction operation date
                  example: '2022-12-28'
                value_date:
                  type: string
                  format: date
                  example: '2022-12-28'
                amount:
                  type: number
                  example: -20

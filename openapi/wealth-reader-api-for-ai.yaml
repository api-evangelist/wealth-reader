                type: string
                example: 1234-ABC
              brand:
                type: string
                example: BMW
              model:
                type: string
                example: 320d
              year:
                type: integer
                example: 2024
              serial_number:
                type: string
                description: For machinery/equipment
              address:
                type: string
                description: For real estate
          financials:
            type: object
            description: Financial terms
            properties:
              capital_financed:

            loans:
              $ref: '#/components/schemas/loans'
            deposits:
              $ref: '#/components/schemas/deposits'
            leases:
              $ref: '#/components/schemas/leases'
            insurances:
              $ref: '#/components/schemas/insurances'
            properties:
              $ref: '#/components/schemas/properties'
            files:
              $ref: '#/components/schemas/files'
            contracts:
              $ref: '#/components/schemas/contracts'
            factoring:
              $ref: '#/components/schemas/factoring'
            confirming:
              $ref: '#/components/schemas/confirming'
            employment:
              $ref: '#/components/schemas/employment'
            guarantees:
              $ref: '#/components/schemas/guarantees'
        statistics:
          $ref: '#/components/schemas/statistics'
    user_information:
      type: object
      description: Information related to the person logging in
      required:
        - ID
        - name
      properties:
        ID:
          type: string
          example: 12345678Z
        name:
          type: string
          example: LUIS GARCIA BAQUERO
        gender:
          type: string
          enum:
            - male
            - female
          example: male
        birth_date:
          type: string
          format: date
          example: '1980-09-26'
        birth_place:
          type: string
          example: Ibiza
        email:
          type: string
          example: lgarcia@gmail.com
        cell_phone:
          type: string
          description: Phone number with international prefix, without spaces
          example: '+34666123456'
        address:
          type: string
          example: CALLE BAILEN 41 1A
        city:
          type: string
          example: MADRID
        country:
          type: string
          example: SPAIN
        postal_code:
          type: string
          example: '28005'
        marital_status:
          type: string
          enum:
            - single
            - married
          example: married
        job:
          type: string
          description: >-
            The value here varies greatly from one entity to another: from
            indicating only if it is self-employment or employment to indicating
            the type of profession
          example: CUENTA PROPIA
    portfolios:
      type: array
      description: Investment portfolios. Item schema depends on subtype.
      items:
        oneOf:
          - $ref: '#/components/schemas/portfolio_funds'
          - $ref: '#/components/schemas/portfolio_stocks'
          - $ref: '#/components/schemas/portfolio_pension_plans'
          - $ref: '#/components/schemas/portfolio_bonds'
          - $ref: '#/components/schemas/portfolio_alternative_investments'
          - $ref: '#/components/schemas/portfolio_crypto'
        discriminator:
          propertyName: subtype
          mapping:
            funds: '#/components/schemas/portfolio_funds'
            stocks: '#/components/schemas/portfolio_stocks'
            pension-plans: '#/components/schemas/portfolio_pension_plans'
            bonds: '#/components/schemas/portfolio_bonds'
            alternative-investments: '#/components/schemas/portfolio_alternative_investments'
            crypto: '#/components/schemas/portfolio_crypto'
    portfolio_common:
      type: object
      description: >-
        Portfolio container. The fields available in composition depend on the
        subtype.
      required:
        - subtype
        - uuid
        - code
        - name
        - currency
        - total_value
        - weighted_return
        - annualized_volatility
        - yield
        - contributions
        - withholdings
        - owners
        - composition
        - transactions
      properties:
        subtype:
          type: string
          description: >-
            Portfolio subtype. Determines which keys may appear in composition
            items.
          enum:
            - funds
            - stocks
            - pension-plans
            - bonds
            - alternative-investments
            - crypto
          example: funds
        uuid:
          type: string
          description: >-
            Unique identifier, in relation to the user, assigned by Wealth
            Reader
          example: 05e4563f5bbf2d06efd0a29ebe7edbbb4e1bff63
        code:
          type: string
          example: '1465010091400123456789'
        name:
          type: string
          example: Fondo Dinámico
        currency:
          type: string
          example: EUR
        total_value:
          type: number
          example: 3275.6
        weighted_return:
          type: number
          nullable: true
          example: 8.49
        annualized_volatility:
          type: number
          nullable: true
          description: The value will be 0 when the entity does not provide it
          example: 0
        yield:
          type: number
          nullable: true
          example: 256.27
        contributions:
          type: number
          nullable: true
          example: 3019.33
        withholdings:
          type: number
          nullable: true
          example: 0
        contracting_date:
          type: string
          format: date
          nullable: true
          example: '2016-04-27'
        linked_account:
          type: string
          nullable: true
          description: >-
            IBAN code without spaces. The value will be null when the entity
            does not provide it
          example: ES4021005321592566566159
        portfolio_statement:
          type: string
          format: byte
          nullable: true
          description: >-
            Base64-encoded PDF statement for the portfolio (when provided by the
            entity)
          example: JVBERi0xLjQKJ...
        owners:
          $ref: '#/components/schemas/owners'
        composition:
          type: array
          description: >-
            Positions that make up the portfolio. The item schema depends on
            subtype.
        transactions:
          $ref: '#/components/schemas/portfolio_transactions'
    portfolio_funds:
      allOf:
        - $ref: '#/components/schemas/portfolio_common'
        - type: object
          properties:
            subtype:
              type: string
              enum:
                - funds
              example: funds
            composition:
              $ref: '#/components/schemas/portfolio_composition_funds'
    portfolio_alternative_investments:
      allOf:
        - $ref: '#/components/schemas/portfolio_common'

          - issuer
          - description
          - account
          - status
          - amount
          - pdf_file
        properties:
          last_receipt_date:
            type: string
            format: date
            example: '2023-07-23'
          issuer:
            type: string
            example: Canal de Isabel II
          description:
            type: string
            example: RECIBO CONTRATO 328774628 FACTURA DEL 18 07 23
          account:
            type: string
            example: ES0123456789012345678901
          status:
            type: string
            enum:
              - paid
              - pending
              - overdue
            example: paid
          amount:
            type: number
            example: 50.75
          pdf_file:
            type: string
            description: PDF file encoded in Base64
          pdf_file_settled:
            type: boolean
            description: >-

              $ref: '#/components/schemas/portfolio_composition_crypto'
    portfolio_transactions:
      type: array
      items:
        $ref: '#/components/schemas/portfolio_transaction'
    portfolio_transaction:
      type: object
      required:
        - uuid
        - value_date
        - operation_type
        - shares
        - price
        - total_amount
        - currency
      properties:
        uuid:
          type: string
          description: >-
            Unique identifier, in relation to the portfolio uuid, assigned by
            Wealth Reader
          example: 05e4563f5bbf2d06efd0a29ebe7edbbb4e1bff63
        operation_pending:
          type: boolean
          description: Indicates whether the operation is pending execution or not.
          example: false
        operation_date:
          type: string
          format: date
          nullable: true
          example: '2020-01-30'
        value_date:
          type: string
          format: date
          example: '2020-01-30'
        operation_type:
          type: string
          enum:
            - purchase
            - sale
            - subscription by transfer
            - redemption by transfer
            - scrip dividend
            - capital increase
            - equity rights
            - equity fee
            - equity adjustment
          example: purchase
        shares:
          type: number
          example: 1076.8273
        price:
          type: number
          example: 11.1438
        total_amount:
          type: number
          example: 12000
          minimum: 0
          description: >-
            It is always an absolute value. The sign is defined by
            operation_type
        currency:
          type: string
          description: Original currency of the transaction.
          example: EUR
        reference_currency:
          type: string
          description: >-
            Portfolio currency. This field is only included when it differs from
            currency.
          example: USD
        exchange_rate:
          type: number
          description: >-
            Exchange rate between currency and reference_currency. This field is
            only included when reference_currency differs from currency.
          example: 1

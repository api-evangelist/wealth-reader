            example: '000117001234567'
          name:
            type: string
            example: FACTORING PPAL SIN RECURSO
          assignor_id:
            type: string
            description: Assignor tax identification number (NIF)
            example: B12345678
          assignor:
            type: string
            description: >-
              Assignor name. The user or company that sells invoices to obtain
              liquidity.
            example: QUICKSILVER DISTRIBUCION Y LOGISTICA SL
          assignor_type:
            type: string
            description: Type of factoring agreement
            enum:
              - non-recourse-factor
              - recourse-factor
            example: non-recourse-factor
          assignee:
            type: string
            description: >-
              Assignee name. The banking or financial institution that acquires
              the collection rights.
            example: Banco Sabadell
          currency:
            type: string
            example: EUR
          balances:
            type: object
            properties:
              available:
                type: number
                example: 11360.26
              disposed:
                type: number
                example: 0
              limit:
                type: number
                example: 11360.26
          interest_rate:
            type: number
            example: 5.25
          linked_account:
            type: string
            description: >-
              IBAN code without spaces. The value will be null when the entity
              does not provide it.
            example: ES0700812345678987654321
          next_payment_date:
            type: string
            example: ''
          number_invoices:
            type: integer
            example: 8
          total_value:
            type: number
            description: Total value of invoices
            example: 14495.28
          total_advanced_value:
            type: number
            description: Total advanced value
            example: 6919.29
          clients:
            type: array
            description: List of clients associated with the factoring contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the client
                  example: 2ea19f8f8bcda4fa5e54e139852e0a7459d16b49
                client_id:
                  type: string
                  description: Client tax identification number
                  example: A12345678
                client_name:
                  type: string
                  description: Client name
                  example: EMPRESA 1 SA
                limit:
                  type: number
                  description: Credit limit for the client
                  example: 50000
                disposed:
                  type: number
                  description: Amount disposed/used by the client
                  example: 15000
                available:
                  type: number
                  description: Available credit for the client
                  example: 35000
                payment_method:
                  type: string
                  description: Payment method for the client
                  enum:
                    - bank-check
                    - check
                    - domiciled_bill
                    - accepted_domiciled_bill
                    - non_domiciled_bill
                    - accepted_non_domiciled_bill
                    - non_order_promissory_note
                    - order_promissory_note
                    - accepted_receipt
                    - domiciled_receipt
                    - non_domiciled_receipt
                    - transfer_payment
                  example: transfer_payment
                payment_deadline:
                  type: integer
                  description: Payment deadline in days
                  example: 30
          invoices:
            type: array
            description: List of invoices associated with the factoring contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the invoice
                  example: 6b556584df0721e5f0b27448247c9682a6470d11
                invoice_id:
                  type: string
                  description: Invoice number or reference
                  example: 2023-53
                client_id:
                  type: string
                  description: Client tax identification number
                  example: A12345678
                operation_date:
                  type: string
                  format: date
                  description: Date when the invoice was factored
                  example: '2023-10-25'
                due_date:
                  type: string
                  format: date
                  description: Invoice due date
                  example: '2024-01-24'
                payment_date:
                  type: string
                  format: date
                  description: Date when the invoice was paid
                  example: '2024-01-20'
                invoice_amount:
                  type: number
                  description: Invoice amount
                  example: 918.45
                received_amount:
                  type: number
                  description: Amount received/advanced
                  example: 873.53
                status:
                  type: string
                  description: Invoice status
                  enum:
                    - cancelled
                    - disputed
                    - funded
                    - pending_collection
                    - prefinancing
                    - overdue
                  example: funded
                additional_info:
                  $ref: '#/components/schemas/additional_info'
          transactions:
            type: array
            description: List of transactions associated with the factoring contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the transaction
                  example: 8a3b5c7d9e1f2a4b6c8d0e2f4a6b8c0d2e4f6a8b
                operation_date:
                  type: string
                  format: date
                  description: Date when the transaction was executed
                  example: '2023-10-25'
                value_date:
                  type: string
                  format: date
                  description: Value date of the transaction
                  example: '2023-10-26'
                amount:
                  type: number
                  description: Transaction amount
                  example: 1500
                currency:
                  type: string
                  description: Transaction currency
                  example: EUR
                description:
                  type: string
                  description: Transaction description
                  example: ANTICIPO FACTURA 2023-53
    confirming:
      type: array
      items:
        type: object
        description: Confirming contracts
        properties:
          uuid:
            type: string
            example: a62ae601a424403d0fbe968d335378421006c277
          contract_number:
            type: string
            example: '000117001234567'
          name:
            type: string
            example: CONFIRMING PPAL SIN RECURSO
          currency:
            type: string
            example: EUR
          balances:
            type: object
            properties:
              available:
                type: number
                example: 11360.26
              disposed:
                type: number
                example: 0
              limit:
                type: number
                example: 11360.26
          interest_rate:
            type: number
            example: 5.25
          linked_account:
            type: string
            example: ES0700812345678987654321
          next_payment_date:
            type: string
            example: ''
          number_invoices:
            type: integer
            example: 8
          total_value:
            type: number
            description: Total value of invoices
            example: 14495.28
          total_advanced_value:
            type: number
            description: Total advanced value
            example: 6919.29
          deferrals:
            type: array
            description: >-
              Validated confirming deferral rows. May be present when one status
              result failed; totals are then omitted.
            items:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - paid
                    - unpaid
                overdue:
                  type: boolean
                  description: Present as true for Impagado deferrals
                start_date:
                  type: string
                  format: date
                due_date:
                  type: string
                  format: date
                total_value:
                  type: number
                deferred_value:
                  type: number
                interest_value:
                  type: number
                interest_rate:
                  type: number
                late_fees:
                  type: number
          deferrals_summary:
            type: object
            description: >-
              Present only when all requested deferral statuses completed
              successfully.
            properties:
              count:
                type: integer
              total_value:
                type: number
              deferred_value:
                type: number
              interest_value:
                type: number
              late_fees:
                type: number
          providers:
            type: array
            description: List of providers associated with the confirming contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the provider
                  example: 2ea19f8f8bcda4fa5e54e139852e0a7459d16b49
                company_id:
                  type: string
                  description: Company tax identification number
                  example: A12345678
                company_name:
                  type: string
                  description: Company name
                  example: EMPRESA 1 SA
          invoices:
            type: array
            description: List of invoices associated with the confirming contract
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier for the invoice
                  example: 6b556584df0721e5f0b27448247c9682a6470d11
                invoice_id:
                  type: string
                  description: Invoice number or reference
                  example: 2023-53
                provider_id:
                  type: string
                  description: Provider tax identification number
                  example: A12345678
                operation_date:
                  type: string
                  format: date
                  description: Date when the invoice was processed
                  example: '2023-10-25'
                due_date:
                  type: string
                  format: date
                  description: Invoice due date
                  example: '2024-01-24'
                amount:
                  type: number
                  description: Invoice amount
                  example: 918.45
                status:
                  type: string
                  description: Invoice status (e.g., pending, advanced, paid)
                  example: advanced
                additional_info:
                  $ref: '#/components/schemas/additional_info'
          additional_info:
            $ref: '#/components/schemas/additional_info'
    employment:
      type: object
      description: Employment history / work life and contributions
      properties:
        summary:
          type: object
          description: Aggregated summary of employment history
          properties:
            totalDaysRegistered:
              type: integer
              description: Total days registered
              example: 8912
            daysInMultipleActivity:
              type: integer
              description: Days in multiple activity
              example: 130
            daysContributedForBenefits:
              type: integer
              description: Days contributed for benefits
              example: 8782
            totalTimeEquivalence:
              type: string
              description: Total time equivalence
              example: 24 años, 0 meses y 17 días.
        periods:
          type: array
          description: >-
            List of employment and similar periods (employment, unemployment,
            self-employment, etc.)
          items:
            type: object
            required:
              - employer
              - regime
              - contract
              - category
              - actualStartDate
              - startDate
              - endDate
              - contributedDays
            properties:
              employer:
                type: string
                example: TRABAJADOR AUTONOMO
              regime:
                type: string
                example: AUTONOMO
              contract:
                type: string
                example: INDEFINIDO.TIEMPO COMPLETO.ORDINARIO
              category:
                type: string
                example: INGENIEROS LICENCIADOS
              actualStartDate:
                type: string
                format: date
                example: '2022-11-10'
              startDate:
                type: string
                format: date
                example: '2022-11-10'
              endDate:
                type: string
                description: End date or 'Actual' if the period is ongoing
                example: Actual
              contributedDays:
                type: integer
                description: Days contributed within the period
                example: 1062
    guarantees:
      type: array
      items:
        type: object
        description: Bank guarantees and sureties (technical and financial)
        required:
          - uuid
          - code
          - name
          - subtype
          - currency
          - balances
        properties:
          uuid:
            type: string
            description: >-
              Unique identifier, in relation to the user, assigned by Wealth
              Reader
            example: 90763109952d4f2ebece8dceca8254078c5384a0
          code:
            type: string
            description: Bank's internal identifier for the guarantee
            example: f2eb8HsfBDSDseBw8HeSccOwJweJ2OfxH2xDw8Ss
          name:
            type: string
            description: Commercial name of the guarantee according to the entity
            example: Aval Financiero
          nickname:
            type: string
            description: Alias if the entity provides it
            example: Aval Técnico
          subtype:
            type: string
            description: Type of guarantee/surety
            enum:
              - financial
              - technical
              - other
            example: financial
          currency:
            type: string
            example: EUR
          linked_account:
            type: string
            description: IBAN of the linked account (if the entity provides it)
            example: ES1001289462580857003432
          issuer:
            type: string
            description: Issuing entity if applicable (when not the main bank itself)
            example: Bankinter, S.A.
          beneficiary:
            type: string
            description: Beneficiary of the guarantee if available
            example: AYUNTAMIENTO DE MADRID
          purpose:
            type: string
            description: Purpose/object of the guarantee if the entity indicates it
            example: Licitación obra pública expediente 2025/00123
          issue_date:
            type: string
            format: date
            description: Issue date
            example: '2024-06-12'
          expiration_date:
            type: string
            format: date
            description: Expiration date if exists
            example: '2026-06-11'
          status:
            type: string
            description: Operational status of the guarantee
            enum:
              - active
              - cancelled
              - expired
              - pending_activation
            example: active
          balances:
            type: object
            description: Key amounts of the guarantee
            properties:
              guaranteed_amount:
                type: number
                description: Guaranteed nominal amount
                example: 50000
              exposure:
                type: number
                description: >-
                  Outstanding risk/amount used under the guarantee (if
                  applicable)
                example: 0
              available:
                type: number
                description: Remaining available amount (if applicable to guarantee lines)
                example: 50000
              euro_equivalent:
                type: number
                description: Euro equivalent if the guarantee currency is different
                example: 50000
          fees_commissions:
            type: object
            description: Information about associated fees, if the entity provides it
            properties:
              periodicity:
                type: string
                enum:
                  - monthly
                  - quarterly
                  - semiannual
                  - annual
                  - at_issuance
                  - other
                example: quarterly
              last_charge_date:
                type: string
                format: date
                example: '2025-03-31'
              last_charge_amount:
                type: number
                example: 125
          additional_info:
            type: array
            description: Non-standardized bank-specific fields
            items:
              type: object
              properties:
                key:
                  type: string
                  example: euroEquivalent
                value:
                  type: string
                  example: '0.00'
    owners:
      type: array
      description: Array of owners
      items:
        $ref: '#/components/schemas/owner'
    owner:
      type: object
      required:
        - ID
        - name
        - role
      properties:
        ID:
          type: string
          nullable: true
          example: 12345678Z
          description: It may be null if the bank does not specify it
        name:
          type: string
          example: LUIS GARCIA BAQUERO
        role:
          type: string
          enum:
            - owner
            - legal representative
            - administrator
            - attorney-in-fact
            - authorised
          example: owner
    warning-error-codes:
      type: array
      items:
        type: object
        required:
          - code
          - description
          - possible_reasons
          - how_to_proceed
        properties:
          code:
            type: integer
            description: Error code
            example: 2
          description:
            type: string
            description: Error description
            example: Incorrect call
          possible_reasons:
            type: string
            description: Possible causes of the error
            example: >-
              Some of the required parameters have not been sent or have been
              sent in an incorrect format
          how_to_proceed:
            type: string
            description: How to act when this error code is obtained
            example: >-
              The text received in "message" will detail the reason for the
              error. For example, "The parameter "api_key" is mandatory".
    entities:
      type: object
      required:
        - code
        - name
        - logo
        - color
        - inputs
        - statistics
      properties:
        code:
          type: string
          example: bancamarch
          description: The institution code
        name:
          type: string
          example: Bancamarch
          description: The institution name
        logo:
          type: string
          example: https://cdn.wealthreader.com/bancamarch.svg
          description: Logo
        color:
          type: string
          example: '#e23e4d'
          description: Predominant color in the logo
        inputs:
          type: object
          properties:
            document_type:
              type: object
              properties:
                required:
                  type: boolean
                  example: false
                  description: Indicates if the field is required
                name:
                  type: string
                  example: DNI;Pasaporte
                  description: >-
                    Field name. Since the 'document type' field is a dropdown
                    list, this string is a semicolon-separated list of values
            user:
              type: object
              properties:
                required:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Username
            password:
              type: object
              properties:
                required:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Access key
        statistics:
          $ref: '#/components/schemas/statistics'
    register-user-request:
      type: object
      required:
        - api_key
        - user_id
        - email
        - service
      properties:
        api_key:
          type: string
          description: Authentication key (8 alphanumeric characters)
          example: A1B2C3D4
        user_id:
          type: string
          description: User identification document.
          example: 12345678A
        service:
          type: string
          description: Service associated with the user. Determines the data flow.
          enum:
            - integra
            - easy-transfer
          example: easy-transfer
        email:
          type: string
          format: email
          description: User email, used according to service type.
          example: sai_banker@singularbank.com
    register-user-response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User registered successfully
    check-user-request:
      type: object
      required:
        - api_key
        - user_id
      properties:
        api_key:
          type: string
          description: Authentication key
          example: A1B2C3D4
        user_id:
          type: string
          description: User identification document.
          example: 12345678A
    check-user-response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        registered:
          type: boolean
          example: true
        user_id:
          type: string
          example: '12345'
        links:
          type: object
          description: >-
            Collection of links to different aggregation services registered by
            the user.
          additionalProperties:
            type: string
            format: uri
          example:
            easy-transfer: https://singularbank.wealthreader.com/...
            integra: https://www.acumulas.com/register?...
    revoke-user-request:
      type: object
      required:
        - api_key
        - user_id
        - service
      properties:
        api_key:
          type: string
          description: Authentication key (8 alphanumeric characters)
          example: A1B2C3D4
        user_id:
          type: string
          description: User identification document.
          example: 12345678A
        service:
          type: string
          enum:
            - integra
            - easy-transfer
            - all
          description: Service from which to unregister the user. 'all' for all services.
          example: easy-transfer
    revoke-user-response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User unregistered successfully
    error-response:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid API key
    batch-connection:
      type: object
      description: >
        Structure of each connection in the array - accepts all parameters from
        the /entities/ method

        Must always send credential_id + code + (token OR credentials)
      required:
        - credential_id
        - code
      properties:
        credential_id:
          type: string
          description: Client's unique identifier for this credential
          example: cred_001
        code:
          type: string
          description: >-
            Name of the entity. The complete list is available with GET
            /entities/
          example: santander
        token:
          type: string
          description: |
            Value for custodied credentials, previously tokenized through a call
            with tokenize=true. Alternative to user/password.
          example: FRJ0mHlaqZwLzu
        user:
          type: string
          description: User (required if token is not sent)
        password:
          type: string
          description: Password (required if token is not sent)
        product_types:
          type: string
          description: |
            List of product types from which information is to be retrieved.
            Accepts multiple values separated by commas. Default value is ALL.
          example: accounts,cards,portfolios
        only_balances:
          type: boolean
          default: false
          description: |
            Indicates whether to obtain only the balances of the products
            instead of all available information
        date_from:
          type: string
          format: date
          description: |
            Date from which transactions are requested, in YYYY-MM-DD format.
            Must be a date before today.
          example: '2024-01-01'
        date_to:
          type: string
          format: date
          description: >-
            Only applies to restricting by future dates for loan and confirming
            products, in YYYY-MM-DD format. The date must be later than today.
          example: '2025-12-31'
        required_products_schema:
          type: string
          description: >-
            Required products schema. Indicates the specific accounts or cards
            from which data is desired, with additional per-product
            configurations (only_balances, add_pdf_from_uuids, date_from).
            Accepts a JSON string.
          example: '{"ACCOUNTS":{"0ae4d722b1c82feeafb4b36b2893230444071335":{"only_balances":false,"date_from":"2024-04-03"}}}'
        add_pdf_from_uuids:
          type: string
          description: >-
            Accepts transaction UUIDs separated by commas. Only taken into
            account if product_types is ALL or includes accounts. Adds the PDF
            document associated with each requested bank transaction.
          example: 20966426721d0885ef9d4b95535e1d3198936f16,8772d6c978d37d7af83094abf380b8b703e94105
        force_historic_transactions:
          type: boolean
          default: false
          description: >-
            If true, forces retrieval of the full transaction history available
            at the entity, ignoring the date_from filter.
        second_password:
          type: string
          description: >-
            Second password or security answer, required by some entities in
            addition to the main password.
        third_password:
          type: string
          description: >-
            Third credential field required by some entities (e.g. PIN, card
            number).
        contract_name:
          type: string
          description: >-
            Contract or account alias required by some entities to identify a
            specific contract within a multi-contract access.
servers:
  - description: Production Server
    url: https://api.wealthreader.com/

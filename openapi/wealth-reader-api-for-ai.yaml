            enum:
              - repository
              - on-the-fly
            example: repository
          file_type:
            type: string
            description: File type
            enum:
              - Norma 43
              - Norma 19
              - Norma 57
              - Norma 34
              - MT940
              - MT103
              - SEPA XML
              - BAI2
              - CAMT
              - AFB120
              - ACH
            example: Norma 43
          description:
            type: string
            description: File description
            example: Monthly account statement
          content:
            type: string
            format: byte
            description: File content encoded in Base64
    contracts:
      type: array
      items:
        type: object

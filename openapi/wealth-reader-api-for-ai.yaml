                date:
                  type: string
                  format: date
                  example: '2030-12-01'
                amortized:
                  type: number
                  description: Amortized capital
                  example: 515.43
                interest:
                  type: number
                  description: Interest to be paid
                  example: 524.87
                total:
                  type: number
                  description: Total payment
                  example: 1040.3
                pending_capital:
                  type: number
                  description: Pending capital after this payment

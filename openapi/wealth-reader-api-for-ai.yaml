                  example: 515.43
                interest:
                  type: number
                  description: Interest paid
                  example: 524.87
                total:
                  type: number
                  description: Total payment
                  example: 1040.3
                pending_capital:
                  type: number
                  description: Pending capital after this payment
                  example: 166639.77
                operation_type:
                  type: string

              total_paid:
                type: number
                description: Total paid (fees + services + taxes)
              total_pending:
                type: number
              principal_outstanding:
                type: number
                description: Outstanding principal (if applicable in leasing)
              accrued_interest:
                type: number
                description: Accrued unpaid interest
          installments:
            type: object
            description: Installment schedule
            properties:
              paid:
                type: array
                items:

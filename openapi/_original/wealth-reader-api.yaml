            '
        el:
          summary: Λίστα κωδικών σφάλματος
          description: 'Λίστα κωδικών σφάλματος. Δώστε ιδιαίτερη προσοχή στο γεγονός
            ότι δεν πρέπει όλοι οι κωδικοί σφάλματος να αντιμετωπίζονται με τον ίδιο
            τρόπο από την εφαρμογή σας. Για ένα σφάλμα λανθασμένου κωδικού πρόσβασης,
            δεν πρέπει να επαναλάβετε την κλήση με τις ίδιες παραμέτρους, αλλά για
            ένα σφάλμα που υποδεικνύει ότι η οντότητα είναι υπό συντήρηση, μπορείτε
            να δοκιμάσετε ξανά. Ζητήστε μια τεχνική συνεδρία με την ομάδα μας για
            να επιλύσετε τυχόν απορίες σχετικά με τη διαχείριση σφαλμάτων.

            '
        ro:
          summary: Lista codurilor de eroare
          description: 'Lista codurilor de eroare. Acordați o atenție deosebită faptului
            că nu toate codurile de eroare ar trebui să primească același tratament
            din partea aplicației dvs. Pentru o eroare de parolă incorectă, nu ar
            trebui să reîncercați apelul cu aceiași parametri, dar pentru o eroare
            care indică faptul că entitatea este în întreținere, puteți reîncerca.
            Solicitați o sesiune tehnică cu echipa noastră pentru a rezolva orice
            întrebări despre gestionarea erorilor.

            '
        'no':
          summary: Liste over feilkoder
          description: 'Liste over feilkoder. Vær spesielt oppmerksom på at ikke alle
            feilkoder skal behandles likt av applikasjonen din. For en feil med feil
            passord, bør du ikke prøve kallet på nytt med de samme parameterne, men
            for en feil som indikerer at enheten er under vedlikehold, kan du prøve
            igjen. Be om en teknisk sesjon med teamet vårt for å løse eventuelle spørsmål

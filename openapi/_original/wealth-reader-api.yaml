              de:
                description: |
                  Zinskapitalisierungstyp:
                  * `none` - Zinsen werden an linked_account ausgezahlt, Kapital bleibt konstant
                  * `simple` - Zinsen nur auf ursprüngliches Kapital berechnet, können anfallen (accrued_interest) ohne weitere Zinsen zu generieren
                  * `compound` - Zinsen werden am Ende jeder Periode zum Kapital addiert, nächste Periode berechnet Zinsen auf neue Summe
              nl:

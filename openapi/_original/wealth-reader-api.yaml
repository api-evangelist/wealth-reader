        ca:
          summary: Llista de codis d'error
          description: 'Llista de codis d''error. Presta especial atenció al fet que
            no tots els codis d''error han de rebre el mateix tractament per part
            de la teva aplicació. Davant d''un error de contrasenya incorrecta no
            has de reintentar la crida amb els mateixos paràmetres, però davant d''un

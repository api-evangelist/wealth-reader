  /cards/webhook/:
    post:
      tags:
      - Cards (real time)
      summary: Register or rotate the real-time cards webhook
      description: 'Creates or updates the webhook URL of the customer for the
        card_transaction.created and card_enrollment.confirmed events (see the
        cards-webhook-delivery schema for the delivery format and signature). On first
        setup, or when rotate_secret is true, a new webhook_secret (64 hex characters)
        is generated and returned once; in any other case webhook_secret comes back as
        null in the response and cannot be retrieved again. webhook_url must always be
        https:// and must resolve to a publicly routable host: localhost, private,
        loopback, link-local (including the cloud metadata address), CGNAT, multicast and
        reserved addresses are rejected, in any notation (hexadecimal, decimal, octal,
        short dotted or IPv4-mapped IPv6), and so is a hostname that does not resolve at
        all. The same check runs again right before every delivery, not only at
        registration: if the host is repointed at an internal address afterwards (DNS
        rebinding) the delivery is closed as failed with response_excerpt "blocked_host".
        Sending null in webhook_url disables webhooks for that customer; omitting the
        field leaves the stored URL untouched, which is how the secret is rotated without
        changing the URL.

        '
      x-i18n:
        es:
          summary: Registrar o rotar el webhook de tarjetas en tiempo real
          description: 'Da de alta o actualiza la URL de webhook del cliente para los
            eventos card_transaction.created y card_enrollment.confirmed (ver el esquema
            cards-webhook-delivery para el formato de entrega y la firma). En el primer
            alta, o cuando rotate_secret es true, se genera un webhook_secret nuevo (64
            caracteres hex) que se devuelve una única vez; en cualquier otro caso
            webhook_secret viene null en la respuesta y no se puede volver a leer.
            webhook_url debe ser siempre https:// y resolver a un host público: se
            rechazan localhost y las direcciones privadas, de loopback, link-local
            (incluida la de metadatos de cloud), CGNAT, multicast y reservadas, escritas
            en cualquier notación (hexadecimal, decimal, octal, punteada corta o IPv6 con
            IPv4 embebida), y también los nombres que no resuelven. La misma comprobación
            se repite justo antes de cada envío, no sólo al registrar: si el host se
            repunta después a una dirección interna (DNS rebinding), la entrega se cierra
            como failed con response_excerpt "blocked_host". Enviar null en webhook_url
            desactiva los webhooks para ese cliente; omitir el campo deja la URL guardada
            como estaba, que es la forma de rotar el secreto sin tocar la URL.

            '
      operationId: cardsWebhookRegister
      x-webhook-delivery:
        description: 'Body that Wealthreader POSTs to webhook_url for each event of this
          customer. Documented here so the delivery schema stays reachable from the
          operation that registers the webhook.'
        x-i18n:
          es:
            description: 'Cuerpo que Wealthreader envía por POST al webhook_url para cada
              evento de este cliente. Se documenta aquí para que el esquema de entrega
              siga siendo alcanzable desde la operación que registra el webhook.'
        schema:
          $ref: '#/components/schemas/cards-webhook-delivery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - api_key
              properties:
                api_key:
                  type: string
                  description: API key of the customer.
                  x-i18n:
                    es:
                      description: API key del cliente.
                  example: a1b2c3d4
                webhook_url:
                  type: string
                  nullable: true
                  description: 'https:// URL that will receive the events, on a publicly
                    routable host that resolves in DNS. null disables webhooks; omitting
                    the field leaves the stored URL unchanged.'
                  x-i18n:
                    es:
                      description: 'URL https:// que recibirá los eventos, en un host
                        público que resuelva en DNS. null desactiva los webhooks; omitir
                        el campo deja la URL guardada sin cambios.'
                  example: https://cliente.example.com/webhooks/wealthreader-cards
                rotate_secret:
                  type: boolean
                  default: false
                  description: When true, generates and returns a new webhook_secret.
                  x-i18n:
                    es:
                      description: Si es true, genera y devuelve un webhook_secret nuevo.
              example:
                api_key: a1b2c3d4
                webhook_url: https://cliente.example.com/webhooks/wealthreader-cards
                rotate_secret: false
      responses:
        '200':
          description: Webhook registered or updated
          x-i18n:
            es:
              description: Webhook registrado o actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  payload:
                    type: object
                    properties:
                      webhook_url:
                        type: string
                        nullable: true
                      webhook_secret:
                        type: string
                        nullable: true
                        description: Only filled in on creation or rotation; null in any
                          other case.
                        x-i18n:
                          es:
                            description: Solo viene relleno en el alta o al rotar; en
                              cualquier otro caso es null.
                      active:
                        type: boolean
              example:
                success: true
                payload:
                  webhook_url: https://cliente.example.com/webhooks/wealthreader-cards
                  webhook_secret: 9f1c2b3a4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8
                  active: true
        '400':
          description: Invalid webhook_url
          x-i18n:
            es:
              description: webhook_url inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: invalid_webhook_url
                  message:
                    type: string
        '401':
          description: Invalid or inactive api_key
          x-i18n:
            es:
              description: api_key inválida o inactiva
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: unauthorized
                  message:
                    type: string
  /cards/enrollments/:
    post:
      tags:
      - Cards (real time)
      summary: Pre-register the email of an employee
      description: 'Creates an enrollment request in pending status with a short expiry
        (ttl_minutes, 20 by default, between 1 and 60) for the employee to confirm by
        opening the mobile app and entering that email (POST /user-sync-validation/, no
        contract change for the app). It is idempotent: repeating the call for the same
        (api_key, email) while it is still pending and not expired returns the same
        request. If the email is already linked to the calling customer, it returns
        status "active" directly. If it is already linked to a different customer, it
        returns 409. Rate limit: at most 60 calls to this endpoint per api_key every 60
        seconds, counting every attempt and not only the ones that create a row, checked
        before anything else so the answers that create nothing (200 already active, 409
        linked to another customer, 400) cannot be walked as an enumeration oracle.
        Exceeding it returns 429 with code rate_limited.

        '
      x-i18n:
        es:
          summary: Pre-registrar el email de un empleado
          description: 'Da de alta una solicitud de alta ("enrollment") en estado pending
            con una caducidad corta (ttl_minutes, 20 por defecto, entre 1 y 60) para que
            el empleado la confirme abriendo la app móvil e introduciendo ese email
            (POST /user-sync-validation/, sin cambios de contrato para la app). Es
            idempotente: repetir la llamada para el mismo (api_key, email) mientras siga
            pending y sin caducar devuelve la misma solicitud. Si el email ya está
            vinculado al mismo cliente que llama, devuelve status "active" directamente.
            Si ya está vinculado a otro cliente distinto, devuelve 409. Límite de
            frecuencia: máximo 60 llamadas a este endpoint por api_key cada 60 segundos,
            contando todos los intentos y no sólo los que crean una fila, y comprobado
            antes que nada para que las respuestas que no crean nada (200 ya activo, 409
            vinculado a otro cliente, 400) no sirvan como oráculo de enumeración.
            Superarlo devuelve 429 con code rate_limited.

            '
      operationId: cardsEnrollmentsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - api_key
              - email
              properties:
                api_key:
                  type: string
                  description: API key of the customer.
                  x-i18n:
                    es:
                      description: API key del cliente.
                  example: a1b2c3d4
                email:
                  type: string
                  format: email
                  description: Email of the employee to pre-register.
                  x-i18n:
                    es:
                      description: Email del empleado a pre-registrar.
                  example: empleado@cliente.com
                ttl_minutes:
                  type: integer
                  default: 20
                  minimum: 1
                  maximum: 60
                  description: Minutes the request stays valid before expiring.
                  x-i18n:
                    es:
                      description: Minutos de validez de la solicitud antes de expirar.
              example:
                api_key: a1b2c3d4
                email: empleado@cliente.com
                ttl_minutes: 20
      responses:
        '200':
          description: Request created, reused or already active
          x-i18n:
            es:
              description: Solicitud creada, reutilizada o ya activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cards-enrollment-response'
              example:
                success: true
                payload:
                  enrollment_id: 0f3a9c7b1d2e4f5a6b7c8d9e0f1a2b3c
                  status: pending
                  email: empleado@cliente.com
                  expires_at: '2026-07-11T14:22:11+02:00'
                  confirmed_at: null
                  user_id: null
        '400':
          description: Invalid parameters (email or ttl_minutes)
          x-i18n:
            es:
              description: Parámetros inválidos (email o ttl_minutes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: invalid_email
                  message:
                    type: string
        '401':
          description: Invalid or inactive api_key
          x-i18n:
            es:
              description: api_key inválida o inactiva
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: unauthorized
                  message:
                    type: string
        '409':
          description: The email is already linked to another customer
          x-i18n:
            es:
              description: El email ya está vinculado a otro cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: email_linked_to_other_client
                  message:
                    type: string
        '429':
          description: Too many calls to this endpoint for this api_key in the last 60 seconds
          x-i18n:
            es:
              description: Demasiadas llamadas a este endpoint para esta api_key en los
                últimos 60 segundos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: rate_limited
                  message:
                    type: string
    get:
      tags:
      - Cards (real time)
      summary: Check the status of an enrollment
      description: 'Read-only status of an enrollment request. It has no side effects on
        card users, unlike POST /user-sync-validation/, which does confirm. The only
        write allowed is lazily marking a pending enrollment whose expiry date has
        already passed as expired.

        '
      x-i18n:
        es:
          summary: Consultar el estado de un enrollment
          description: 'Lectura del estado de una solicitud de alta. No tiene efectos
            secundarios sobre los usuarios de tarjetas, a diferencia de
            POST /user-sync-validation/, que sí confirma. La única escritura permitida es
            marcar como expired, de forma perezosa, un enrollment pending cuya fecha de
            caducidad ya pasó.

            '
      operationId: cardsEnrollmentsStatus
      parameters:
      - name: api_key
        in: query
        required: true
        schema:
          type: string
        description: 'API key of the customer. Note it travels in the query string, so it
          ends up in access logs and intermediary proxies.'
        x-i18n:
          es:
            description: 'API key del cliente. Ojo: viaja en la query string, así que
              queda registrada en los logs de acceso y en los proxies intermedios.'
        example: a1b2c3d4
      - name: enrollment_id
        in: query
        required: true
        schema:
          type: string
        description: Identifier returned by POST /cards/enrollments/.
        x-i18n:
          es:
            description: Identificador devuelto por POST /cards/enrollments/.
        example: 0f3a9c7b1d2e4f5a6b7c8d9e0f1a2b3c
      responses:
        '200':
          description: Enrollment status
          x-i18n:
            es:
              description: Estado del enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cards-enrollment-response'
              example:
                success: true
                payload:
                  enrollment_id: 0f3a9c7b1d2e4f5a6b7c8d9e0f1a2b3c
                  status: active
                  email: empleado@cliente.com
                  expires_at: '2026-07-11T14:22:11+02:00'
                  confirmed_at: '2026-07-11T14:10:03+02:00'
                  user_id: e9f4c2a1b3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7
        '401':
          description: Invalid or inactive api_key
          x-i18n:
            es:
              description: api_key inválida o inactiva
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: unauthorized
                  message:
                    type: string
        '404':
          description: The enrollment does not exist or does not belong to this api_key
          x-i18n:
            es:
              description: El enrollment no existe o no pertenece a esta api_key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: not_found
                  message:
                    type: string
  /cards/transactions/:
    get:
      tags:

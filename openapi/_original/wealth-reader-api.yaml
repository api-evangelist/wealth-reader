              ru:
                description: Информация о связанных комиссиях, если банк её предоставляет
              zh:
                description: 相关费用信息（如果银行提供）
              ja:
                description: 関連手数料に関する情報（金融機関が提供する場合）
            properties:
              periodicity:
                type: string
                enum:
                - monthly
                - quarterly
                - semiannual
                - annual
                - at_issuance
                - other
                example: quarterly
              last_charge_date:
                type: string
                format: date
                example: '2025-03-31'
              last_charge_amount:
                type: number
                example: 125.0
          additional_info:
            type: array
            description: Non-standardized bank-specific fields
            items:
              type: object
              properties:
                key:
                  type: string
                  example: euroEquivalent
                value:
                  type: string
                  example: '0.00'
    owners:
      type: array
      description: Array of owners
      x-i18n:
        es:
          description: Array de titulares
        fr:
          description: Tableau de propriétaires
        de:
          description: Array von Eigentümern
        nl:
          description: Array van eigenaren
        ca:
          description: Array de titulars
        pt:
          description: Array de proprietários
        it:
          description: Array di proprietari
        el:
          description: Πίνακας ιδιοκτητών
        ro:
          description: Array de proprietari
        'no':
          description: Array av eiere
        da:
          description: Array af ejere
        fi:
          description: Omistajien taulukko
        ga:
          description: Eagar úinéirí
        ru:
          description: Массив владельцев
        zh:
          description: 所有者数组
        ja:
          description: 所有者の配列
      items:
        $ref: '#/components/schemas/owner'
    owner:
      type: object
      required:
      - ID
      - name
      - role
      properties:
        ID:
          type: string
          nullable: true
          example: 12345678Z
          description: It may be null if the bank does not specify it
        name:
          type: string
          example: LUIS GARCIA BAQUERO
        role:
          type: string
          enum:
          - owner
          - legal representative
          - administrator
          - attorney-in-fact
          - authorised
          example: owner
    warning-error-codes:
      type: array
      items:
        type: object
        required:
        - code
        - description
        - possible_reasons
        - how_to_proceed
        properties:
          code:
            type: integer
            description: Error code
            example: 2
          description:
            type: string
            description: Error description
            example: Incorrect call
          possible_reasons:
            type: string
            description: Possible causes of the error
            example: Some of the required parameters have not been sent or have been
              sent in an incorrect format
          how_to_proceed:
            type: string
            description: How to act when this error code is obtained
            example: The text received in "message" will detail the reason for the
              error. For example, "The parameter "api_key" is mandatory".
    entities:
      type: object
      required:
      - code
      - name
      - logo
      - color
      - inputs
      - statistics
      properties:
        code:
          type: string
          example: bancamarch
          description: The institution code
        name:
          type: string
          example: Bancamarch
          description: The institution name
        logo:
          type: string
          example: https://cdn.wealthreader.com/bancamarch.svg
          description: Logo
        color:
          type: string
          example: '#e23e4d'
          description: Predominant color in the logo
        inputs:
          type: object
          properties:
            document_type:
              type: object
              properties:
                required:
                  type: boolean
                  example: false
                  description: Indicates if the field is required
                name:
                  type: string
                  example: DNI;Pasaporte
                  description: Field name. Since the 'document type' field is a dropdown
                    list, this string is a semicolon-separated list of values
            user:
              type: object
              properties:
                required:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Username
            password:
              type: object
              properties:
                required:
                  type: boolean
                  example: true
                name:
                  type: string
                  example: Access key
        statistics:
          $ref: '#/components/schemas/statistics'
    register-user-request:
      type: object
      required:
      - api_key
      - user_id
      - email
      - service
      properties:
        api_key:
          type: string
          description: Authentication key (8 alphanumeric characters)
          example: A1B2C3D4
        user_id:
          type: string
          description: User identification document.
          example: 12345678A
        service:
          type: string
          description: Service associated with the user. Determines the data flow.
          enum:
          - integra
          - easy-transfer
          example: easy-transfer
        email:
          type: string
          format: email
          description: User email, used according to service type.
          example: sai_banker@singularbank.com
    register-user-response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User registered successfully
    check-user-request:
      type: object
      required:
      - api_key
      - user_id
      properties:
        api_key:
          type: string
          description: Authentication key
          example: A1B2C3D4
        user_id:
          type: string
          description: User identification document.
          example: 12345678A
    check-user-response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        registered:
          type: boolean
          example: true
        user_id:
          type: string
          example: '12345'
        links:
          type: object
          description: Collection of links to different aggregation services registered
            by the user.
          additionalProperties:
            type: string
            format: uri
          example:
            easy-transfer: https://singularbank.wealthreader.com/...
            integra: https://www.acumulas.com/register?...
    revoke-user-request:
      type: object
      required:
      - api_key
      - user_id
      - service
      properties:
        api_key:
          type: string
          description: Authentication key (8 alphanumeric characters)
          example: A1B2C3D4
        user_id:
          type: string
          description: User identification document.
          example: 12345678A
        service:
          type: string
          enum:
          - integra
          - easy-transfer
          - all
          description: Service from which to unregister the user. 'all' for all services.
          example: easy-transfer
    revoke-user-response:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User unregistered successfully
    error-response:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid API key
    batch-connection:
      type: object
      description: 'Structure of each connection in the array - accepts all parameters
        from the /entities/ method

        Must always send credential_id + code + (token OR credentials)

        '
      required:
      - credential_id
      - code
      properties:
        credential_id:
          type: string
          description: Client's unique identifier for this credential
          example: cred_001
        code:
          type: string
          description: Name of the entity. The complete list is available with GET
            /entities/
          example: santander
        token:
          type: string
          description: 'Value for custodied credentials, previously tokenized through
            a call

            with tokenize=true. Alternative to user/password.

            '
          example: FRJ0mHlaqZwLzu
        user:
          type: string
          description: User (required if token is not sent)
        password:
          type: string
          description: Password (required if token is not sent)
        product_types:
          type: string
          description: 'List of product types from which information is to be retrieved.

            Accepts multiple values separated by commas. Default value is ALL.

            '
          example: accounts,cards,portfolios
        only_balances:
          type: boolean
          default: false
          description: 'Indicates whether to obtain only the balances of the products

            instead of all available information

            '
        date_from:
          type: string
          format: date
          description: 'Date from which transactions are requested, in YYYY-MM-DD
            format.

            Must be a date before today.

            '
          example: '2024-01-01'
        date_to:
          type: string
          format: date
          description: Only applies to restricting by future dates for loan and confirming
            products, in YYYY-MM-DD format. The date must be later than today.
          example: '2025-12-31'
        required_products_schema:
          type: string
          description: Required products schema. Indicates the specific accounts or
            cards from which data is desired, with additional per-product configurations
            (only_balances, add_pdf_from_uuids, date_from). Accepts a JSON string.
          example: '{"ACCOUNTS":{"0ae4d722b1c82feeafb4b36b2893230444071335":{"only_balances":false,"date_from":"2024-04-03"}}}'
        add_pdf_from_uuids:
          type: string
          description: Accepts transaction UUIDs separated by commas. Only taken into
            account if product_types is ALL or includes accounts. Adds the PDF document
            associated with each requested bank transaction.
          example: 20966426721d0885ef9d4b95535e1d3198936f16,8772d6c978d37d7af83094abf380b8b703e94105
        force_historic_transactions:
          type: boolean
          default: false
          description: If true, forces retrieval of the full transaction history available
            at the entity, ignoring the date_from filter.
        second_password:
          type: string
          description: Second password or security answer, required by some entities
            in addition to the main password.
        third_password:
          type: string
          description: Third credential field required by some entities (e.g. PIN,
            card number).
        contract_name:
          type: string
          description: Contract or account alias required by some entities to identify
            a specific contract within a multi-contract access.
servers:
- description: Production Server
  url: https://api.wealthreader.com/

            Demana una sessió tècnica amb el nostre equip per resoldre qualsevol dubte
            sobre la gestió d''errors.

            '
        pt:
          summary: Lista de códigos de erro
          description: 'Lista de códigos de erro. Preste atenção especial ao fato
            de que nem todos os códigos de erro devem receber o mesmo tratamento da
            sua aplicação. Para um erro de senha incorreta, você não deve tentar novamente

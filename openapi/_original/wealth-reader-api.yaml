  /batch/load/:
    post:
      tags:
      - Advanced
      x-internal: true
      summary: Batch connection loading
      description: 'This endpoint is optional and not required for standard integrations.
        Use only if explicitly instructed by Wealth Reader.


        **Important**: To use batch process management on Wealthreader''s side, a dedicated
        environment is required. This endpoint is not available on api.wealthreader.com.


        The endpoints grouped under the "batch" tag allow processing multiple bank
        connections asynchronously,

        unlike the `/entities/` method which is synchronous. Ideal for:

        - Processing large volumes of connections, delegating the process to Wealthreader

        - Avoiding timeouts on slow connections

        - Getting a webhook notification per completed credential


        This method starts asynchronous processing of one or multiple bank connections.
        Immediately returns a `batch_id` for tracking.

        **A webhook notification is sent to `notification_url` for each individual credential
        as soon as it completes**, with the following payload fields: `batch_id`,
        `credential_id`, `status`, `timestamp`.

        '
      x-i18n:
        es:
          summary: Carga de conexiones en batch
          description: 'Los endpoints agrupados en la etiqueta "batch" permiten procesar
            múltiples conexiones bancarias de forma asíncrona,

            a diferencia del método `/entities/` que es síncrono. Ideal para:

            - Procesar grandes volúmenes de conexiones, delegando el proceso en Wealthreader

            - Evitar timeouts en conexiones lentas

            - Recibir una notificación webhook por cada credencial completada


            **Importante**: Para utilizar la gestión de procesos batch del lado de Wealthreader
            es necesario contar con un entorno dedicado. Este endpoint no está disponible
            en api.wealthreader.com.


            Este método inicia el procesamiento asíncrono de una o múltiples conexiones
            bancarias. Retorna inmediatamente un `batch_id` para seguimiento.

            **Se envía una notificación webhook a `notification_url` por cada credencial
            completada individualmente**, con los campos: `batch_id`, `credential_id`,
            `status`, `timestamp`.

            '
        fr:
          summary: Chargement de connexions par lot
          description: 'Ce endpoint est optionnel et non requis pour les intégrations
            standard. À utiliser uniquement sur instruction explicite de Wealth Reader.

            **Important** : Pour utiliser la gestion des processus batch du côté de Wealthreader,
            un environnement dédié est nécessaire. Ce endpoint n''est pas disponible sur
            api.wealthreader.com.

            Les endpoints regroupés sous le tag "batch" permettent de traiter plusieurs
            connexions bancaires de manière asynchrone, contrairement à la méthode
            `/entities/` qui est synchrone. Idéal pour traiter de grands volumes de
            connexions et éviter les timeouts.

            '
        de:
          summary: Batch-Verbindungsladung
          description: 'Dieser Endpoint ist optional und für Standardintegrationen
            nicht erforderlich. Nur verwenden, wenn explizit von Wealth Reader angewiesen.

            **Wichtig**: Um die Batch-Prozessverwaltung auf Wealthreader-Seite zu nutzen,
            ist eine dedizierte Umgebung erforderlich. Dieser Endpoint ist nicht auf
            api.wealthreader.com verfügbar.

            Die unter dem Tag "batch" gruppierten Endpoints ermöglichen die asynchrone
            Verarbeitung mehrerer Bankverbindungen, im Gegensatz zur synchronen `/entities/`-Methode.
            Ideal für die Verarbeitung großer Verbindungsmengen und zur Vermeidung
            von Timeouts.

            '
        nl:
          summary: Batch-verbindingen laden
          description: 'Dit endpoint is optioneel en niet vereist voor standaard integraties.
            Gebruik alleen als expliciet geïnstrueerd door Wealth Reader.

            **Belangrijk**: Om batchprocesbeheer aan de Wealthreader-kant te gebruiken,
            is een dedicated omgeving vereist. Dit endpoint is niet beschikbaar op
            api.wealthreader.com.

            De endpoints gegroepeerd onder de "batch" tag maken het mogelijk meerdere
            bankverbindingen asynchroon te verwerken, in tegenstelling tot de synchrone
            `/entities/` methode. Ideaal voor grote volumes verbindingen en het vermijden

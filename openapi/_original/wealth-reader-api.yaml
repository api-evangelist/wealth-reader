# x-archived-from: wealth-reader-api.yaml
# x-archived-on: 2026-09-16
openapi: 3.0.0
info:
  description: 'Regulatory APIs based on PSD2 provide access to certain financial
    information such as bank account balances and transactions. However, there are
    other sources of wealth information that are not accessible through these APIs.
    The Wealth Reader API extends the information offered by regulatory APIs by providing
    real-time access to additional wealth sources in any entity worldwide. There are
    two other related documents that will help you integrate the Wealth Reader API.
    One is the Javascript widget integration guide: https://docs-en.wealthreader.com/
    and the other is a Postman collection based on this documentation.

    Very important: This API definition is adapted for clients integrating via Widget,
    so some parameters that are not necessary for this type of integration have been
    omitted, such as bank authentication parameters, as a token will be used.

    '
  x-i18n:
    es:
      description: 'Las APIs regulatorias basadas en PSD2 proporcionan acceso a cierta
        información financiera como saldos de cuentas bancarias y transacciones. Sin
        embargo, hay otras fuentes de información patrimonial que no son accesibles
        por estas APIs. La API de Wealth Reader amplía la información ofrecida por
        las APIs regulatorias proporcionando acceso en tiempo real a las fuentes patrimoniales
        adicionales en cualquier entidad del mundo. Existen otros dos documentos relacionados
        que te ayudarán a integrar la API de Wealth Reader. Uno es la guía de integración
        del widget Javascript: https://docs-es.wealthreader.com/ y el otro una colección
        Postman basada en esta documentación.

        Muy importante: Esta definición de la API está adaptada para los clientes
        que integran por Widget, por lo que se han omitido algunos parámetros que
        no son necesarios para este tipo de integración, como pueden ser los de autenticación
        con el banco, ya que se utilizará token.

        '
    fr:
      description: 'Les API réglementaires basées sur PSD2 donnent accès à certaines
        informations financières telles que les soldes des comptes bancaires et les
        transactions. Cependant, il existe d''autres sources d''informations sur la
        richesse qui ne sont pas accessibles via ces API. L''API Wealth Reader étend
        les informations offertes par les API réglementaires en fournissant un accès
        en temps réel à des sources de richesse supplémentaires dans toute entité
        mondiale. Il existe deux autres documents connexes qui vous aideront à intégrer
        l''API Wealth Reader. L''un est le guide d''intégration du widget Javascript
        : https://docs-en.wealthreader.com/ et l''autre est une collection Postman
        basée sur cette documentation.

        Très important : Cette définition d''API est adaptée pour les clients intégrant
        via Widget, donc certains paramètres qui ne sont pas nécessaires pour ce type
        d''intégration ont été omis, tels que les paramètres d''authentification bancaire,
        car un token sera utilisé.

        '
    de:
      description: 'Auf PSD2 basierende regulatorische APIs bieten Zugang zu bestimmten
        finanziellen Informationen wie Bankkontensalden und Transaktionen. Es gibt
        jedoch andere Quellen von Vermögensinformationen, die über diese APIs nicht
        zugänglich sind. Die Wealth Reader API erweitert die von regulatorischen APIs
        angebotenen Informationen, indem sie Echtzeitzugang zu zusätzlichen Vermögensquellen
        in jeder Einrichtung weltweit bietet. Es gibt zwei weitere verwandte Dokumente,
        die Ihnen bei der Integration der Wealth Reader API helfen werden. Eines ist
        der Javascript-Widget-Integrationsleitfaden: https://docs-en.wealthreader.com/
        und das andere ist eine auf dieser Dokumentation basierende Postman-Sammlung.

        Sehr wichtig: Diese API-Definition ist für Kunden angepasst, die über Widget
        integrieren, daher wurden einige Parameter weggelassen, die für diesen Integrationstyp
        nicht notwendig sind, wie z.B. Bankauthentifizierungsparameter, da ein Token
        verwendet wird.

        '
    nl:
      description: 'Op PSD2 gebaseerde regulatorische APIs bieden toegang tot bepaalde
        financiële informatie zoals banksaldos en transacties. Er zijn echter andere
        bronnen van vermogensinformatie die niet toegankelijk zijn via deze APIs.
        De Wealth Reader API breidt de door regulatorische APIs aangeboden informatie
        uit door realtime toegang te bieden tot extra vermogensbronnen in elke entiteit
        wereldwijd. Er zijn twee andere gerelateerde documenten die u zullen helpen
        bij het integreren van de Wealth Reader API. Eén is de Javascript widget integratiegids:
        https://docs-en.wealthreader.com/ en de ander is een Postman collectie gebaseerd
        op deze documentatie.

        Zeer belangrijk: Deze API-definitie is aangepast voor klanten die via Widget
        integreren, dus sommige parameters die niet nodig zijn voor dit type integratie
        zijn weggelaten, zoals bankauthenticatieparameters, aangezien een token zal
        worden gebruikt.

        '
    ca:
      description: 'Les APIs reguladores basades en PSD2 proporcionen accés a certa
        informació financera com saldos de comptes bancaris i transaccions. No obstant
        això, hi ha altres fonts d''informació patrimonial que no són accessibles
        per aquestes APIs. L''API de Wealth Reader amplia la informació oferta per
        les APIs reguladores proporcionant accés en temps real a les fonts patrimonials
        addicionals en qualsevol entitat del món. Hi ha dos altres documents relacionats
        que t''ajudaran a integrar l''API de Wealth Reader. Un és la guia d''integració
        del widget Javascript: https://docs-es.wealthreader.com/ i l''altre és una
        col·lecció Postman basada en aquesta documentació.

        Molt important: Aquesta definició de l''API està adaptada per als clients
        que integren per Widget, per la qual cosa s''han omès alguns paràmetres que
        no són necessaris per a aquest tipus d''integració, com poden ser els d''autenticació
        amb el banc, ja que s''utilitzarà un token.

        '
    pt:
      description: 'As APIs regulatórias baseadas em PSD2 fornecem acesso a certas
        informações financeiras, como saldos de contas bancárias e transações. No
        entanto, existem outras fontes de informações patrimoniais que não são acessíveis
        através dessas APIs. A API Wealth Reader estende as informações oferecidas
        pelas APIs regulatórias, fornecendo acesso em tempo real a fontes patrimoniais
        adicionais em qualquer entidade mundial. Existem dois outros documentos relacionados
        que irão ajudá-lo a integrar a API Wealth Reader. Um é o guia de integração
        do widget Javascript: https://docs-en.wealthreader.com/ e o outro é uma coleção
        Postman baseada nesta documentação.

        Muito importante: Esta definição de API é adaptada para clientes que integram
        via Widget, portanto alguns parâmetros que não são necessários para este tipo
        de integração foram omitidos, como os parâmetros de autenticação bancária,
        pois um token será usado.

        '
    it:
      description: 'Le API regolamentari basate su PSD2 forniscono accesso a determinate
        informazioni finanziarie come saldi dei conti bancari e transazioni. Tuttavia,
        esistono altre fonti di informazioni patrimoniali che non sono accessibili
        attraverso queste API. L''API Wealth Reader estende le informazioni offerte
        dalle API regolamentari fornendo accesso in tempo reale a fonti patrimoniali
        aggiuntive in qualsiasi entità mondiale. Esistono altri due documenti correlati
        che ti aiuteranno a integrare l''API Wealth Reader. Uno è la guida all''integrazione
        del widget Javascript: https://docs-en.wealthreader.com/ e l''altro è una
        collezione Postman basata su questa documentazione.

        Molto importante: Questa definizione API è adattata per i clienti che integrano
        tramite Widget, quindi alcuni parametri che non sono necessari per questo
        tipo di integrazione sono stati omessi, come i parametri di autenticazione
        bancaria, poiché verrà utilizzato un token.

        '
    el:
      description: 'Οι κανονιστικές API που βασίζονται στο PSD2 παρέχουν πρόσβαση
        σε ορισμένες χρηματοοικονομικές πληροφορίες όπως υπόλοιπα τραπεζικών λογαριασμών
        και συναλλαγές. Ωστόσο, υπάρχουν άλλες πηγές πληροφοριών πλούτου που δεν είναι
        προσβάσιμες μέσω αυτών των API. Το API Wealth Reader επεκτείνει τις πληροφορίες
        που προσφέρονται από τις κανονιστικές API παρέχοντας πρόσβαση σε πραγματικό
        χρόνο σε πρόσθετες πηγές πλούτου σε οποιαδήποτε οντότητα παγκοσμίως. Υπάρχουν
        δύο άλλα σχετικά έγγραφα που θα σας βοηθήσουν να ενσωματώσετε το API Wealth
        Reader. Το ένα είναι ο οδηγός ενσωμάτωσης του widget Javascript: https://docs-en.wealthreader.com/
        και το άλλο είναι μια συλλογή Postman βασισμένη σε αυτή την τεκμηρίωση.

        Πολύ σημαντικό: Αυτός ο ορισμός API είναι προσαρμοσμένος για πελάτες που ενσωματώνουν
        μέσω Widget, επομένως έχουν παραλειφθεί ορισμένες παράμετροι που δεν είναι
        απαραίτητες για αυτόν τον τύπο ενσωμάτωσης, όπως οι παράμετροι ελέγχου ταυτότητας
        τράπεζας, καθώς θα χρησιμοποιηθεί ένα token.

        '
    ro:
      description: 'API-urile reglementate bazate pe PSD2 oferă acces la anumite informații
        financiare precum soldurile conturilor bancare și tranzacțiile. Cu toate acestea,
        există alte surse de informații privind averea care nu sunt accesibile prin
        aceste API-uri. API-ul Wealth Reader extinde informațiile oferite de API-urile
        reglementate prin furnizarea accesului în timp real la surse suplimentare
        de avere în orice entitate din lume. Există alte două documente conexe care
        vă vor ajuta să integrați API-ul Wealth Reader. Unul este ghidul de integrare
        a widget-ului Javascript: https://docs-en.wealthreader.com/ iar celălalt este
        o colecție Postman bazată pe această documentație.

        Foarte important: Această definiție API este adaptată pentru clienții care
        integrează prin Widget, astfel încât unii parametri care nu sunt necesari
        pentru acest tip de integrare au fost omiși, cum ar fi parametrii de autentificare
        bancară, deoarece va fi utilizat un token.

        '
    false:
      description: 'Regulatoriske API-er basert på PSD2 gir tilgang til viss finansiell
        informasjon som banksaldoer og transaksjoner. Det finnes imidlertid andre
        kilder til formuesinformasjon som ikke er tilgjengelige gjennom disse API-ene.
        Wealth Reader API utvider informasjonen som tilbys av regulatoriske API-er
        ved å gi sanntids tilgang til tilleggsformueskilder i enhver enhet verden
        over. Det finnes to andre relaterte dokumenter som vil hjelpe deg med å integrere
        Wealth Reader API. En er Javascript widget integrasjonsguiden: https://docs-en.wealthreader.com/
        og den andre er en Postman samling basert på denne dokumentasjonen.

        Svært viktig: Denne API-definisjonen er tilpasset kunder som integrerer via
        Widget, så noen parametere som ikke er nødvendige for denne typen integrasjon
        er utelatt, som bankautentiseringsparametere, da et token vil bli brukt.

        '
    da:
      description: 'Regulatoriske API''er baseret på PSD2 giver adgang til visse finansielle
        oplysninger såsom banksaldi og transaktioner. Der findes dog andre kilder
        til formueoplysninger, der ikke er tilgængelige gennem disse API''er. Wealth
        Reader API udvider de oplysninger, der tilbydes af regulatoriske API''er,
        ved at give realtidstilgang til yderligere formuekilder i enhver enhed verden
        over. Der findes to andre relaterede dokumenter, der vil hjælpe dig med at
        integrere Wealth Reader API. Den ene er Javascript widget integrationsguiden:
        https://docs-en.wealthreader.com/ og den anden er en Postman samling baseret
        på denne dokumentation.

        Meget vigtigt: Denne API-definition er tilpasset kunder, der integrerer via
        Widget, så nogle parametre, der ikke er nødvendige for denne type integration,
        er udeladt, såsom bankgodkendelsesparametre, da et token vil blive brugt.

        '
    fi:
      description: 'PSD2-pohjaiset sääntely-API:t tarjoavat pääsyn tiettyihin taloudellisiin
        tietoihin, kuten pankkitilisaldoihin ja tapahtumiin. On kuitenkin olemassa
        muita varallisuustietojen lähteitä, jotka eivät ole saatavilla näiden API:iden
        kautta. Wealth Reader API laajentaa sääntely-API:iden tarjoamia tietoja tarjoamalla
        reaaliaikaisen pääsyn lisävarallisuuslähteisiin missä tahansa maailmanlaajuisessa
        yksikössä. On olemassa kaksi muuta liittyvää asiakirjaa, jotka auttavat sinua
        integroimaan Wealth Reader API:n. Toinen on Javascript-widgetin integraatio-opas:
        https://docs-en.wealthreader.com/ ja toinen on Postman-kokoelma, joka perustuu
        tähän dokumentaatioon.

        Erittäin tärkeää: Tämä API-määrittely on mukautettu asiakkaille, jotka integroivat
        Widgetin kautta, joten jotkin parametrit, joita ei tarvita tällaisessa integraatiossa,
        on jätetty pois, kuten pankkitunnistautumisen parametrit, koska tokenia käytetään.

        '
    ga:
      description: 'Soláthraíonn APIanna rialaitheacha atá bunaithe ar PSD2 rochtain
        ar fhaisnéis airgeadais áirithe amhail iarmhéid cuntas bainc agus idirbhearta.
        Mar sin féin, tá foinsí eile faisnéise saibhris ann nach bhfuil inrochtana
        trí na APIanna seo. Leathnaíonn API Wealth Reader an fhaisnéis a thairgeann
        APIanna rialaitheacha trí rochtain fíor-ama a sholáthar ar fhoinsí saibhris
        breise in aon eintiteas ar fud an domhain. Tá dhá dhoiciméad eile gaolmhara
        ann a chabhróidh leat API Wealth Reader a chomhtháthú. Is é ceann acu an treoir
        chomhtháthaithe widget Javascript: https://docs-en.wealthreader.com/ agus
        is é an ceann eile bailiúchán Postman atá bunaithe ar an doiciméadú seo.

        An-tábhachtach: Tá an sainmhíniú API seo oiriúnaithe do chliaint a dhéanann
        comhtháthú trí Widget, mar sin fágadh amach roinnt paraiméadar nach bhfuil
        riachtanach don chineál seo comhtháthaithe, amhail paraiméadair fíordheimhnithe
        bainc, mar go n-úsáidfear token.

        '
    ru:
      description: 'Регуляторные API на основе PSD2 предоставляют доступ к определенной
        финансовой информации, такой как остатки банковских счетов и транзакции. Однако
        существуют другие источники информации о благосостоянии, которые недоступны
        через эти API. API Wealth Reader расширяет информацию, предлагаемую регуляторными
        API, предоставляя доступ в реальном времени к дополнительным источникам благосостояния
        в любой организации по всему миру. Существует два других связанных документа,
        которые помогут вам интегрировать API Wealth Reader. Один - это руководство
        по интеграции виджета Javascript: https://docs-en.wealthreader.com/ а другой
        - коллекция Postman на основе этой документации.

        Очень важно: Это определение API адаптировано для клиентов, интегрирующих
        через Widget, поэтому некоторые параметры, которые не нужны для этого типа
        интеграции, были опущены, такие как параметры банковской аутентификации, поскольку
        будет использоваться токен.

        '
    zh:
      description: '基于PSD2的监管API提供对某些金融信息的访问，如银行账户余额和交易。然而，还存在其他财富信息来源，这些信息无法通过这些API访问。Wealth
        Reader API通过提供对全球任何实体中额外财富来源的实时访问来扩展监管API提供的信息。还有两个其他相关文档将帮助您集成Wealth Reader
        API。一个是Javascript小部件集成指南：https://docs-en.wealthreader.com/ 另一个是基于此文档的Postman集合。

        非常重要：此API定义适用于通过Widget集成的客户端，因此省略了一些对此类集成不必要的参数，例如银行认证参数，因为将使用令牌。

        '
    ja:
      description: 'PSD2に基づく規制APIは、銀行口座残高や取引などの特定の金融情報へのアクセスを提供します。ただし、これらのAPIではアクセスできない他の富情報源が存在します。Wealth
        Reader APIは、規制APIが提供する情報を拡張し、世界中のあらゆるエンティティにおける追加の富源へのリアルタイムアクセスを提供します。Wealth
        Reader APIの統合に役立つ他の2つの関連ドキュメントがあります。1つはJavascriptウィジェット統合ガイド：https://docs-en.wealthreader.com/
        で、もう1つはこのドキュメントに基づくPostmanコレクションです。

        非常に重要：このAPI定義は、Widget経由で統合するクライアント向けに適応されているため、このタイプの統合に必要のない一部のパラメータ（銀行認証パラメータなど）が省略されており、トークンが使用されます。

        '
    'no':
      description: 'Regulatory APIs based on PSD2 provide access to certain financial
        information such as bank account balances and transactions. However, there
        are other sources of wealth information that are not accessible through these
        APIs. The Wealth Reader API extends the information offered by regulatory
        APIs by providing real-time access to additional wealth sources in any entity
        worldwide. There are two other related documents that will help you integrate
        the Wealth Reader API. One is the Javascript widget integration guide: https://docs-en.wealthreader.com/
        and the other is a Postman collection based on this documentation.

        Very important: This API definition is adapted for clients integrating via
        Widget, so some parameters that are not necessary for this type of integration
        have been omitted, such as bank authentication parameters, as a token will
        be used.

        '

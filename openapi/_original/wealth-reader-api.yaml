            συνδέσεων και αποφυγή timeouts.

            '
        ro:
          summary: Încărcare conexiuni în lot
          description: 'Acest endpoint este opțional și nu este necesar pentru integrările
            standard. Utilizați doar dacă Wealth Reader indică în mod explicit.

            **Important**: Pentru a utiliza gestionarea proceselor batch din partea
            Wealthreader, este necesar un mediu dedicat. Acest endpoint nu este disponibil

                  * `simple` - Interessi calcolati solo sul capitale originale, possono accumularsi (accrued_interest) senza generare nuovi interessi
                  * `compound` - Gli interessi si aggiungono al capitale ogni periodo, il periodo successivo calcola gli interessi sul nuovo totale
              el:
                description: |
                  Τύπος κεφαλαιοποίησης τόκων:
                  * `none` - Οι τόκοι καταβάλλονται στο linked_account, το κεφάλαιο παραμένει σταθερό
                  * `simple` - Οι τόκοι υπολογίζονται μόνο στο αρχικό κεφάλαιο, μπορούν να συσσωρεύονται (accrued_interest) χωρίς να παράγουν νέους τόκους
                  * `compound` - Οι τόκοι προστίθενται στο κεφάλαιο κάθε περίοδο, η επόμενη περίοδος υπολογίζει τόκους στο νέο σύνολο

          summary: Проверка владения банковским счётом через IBAN
          description: 'Эта конечная точка является необязательной и не требуется
            для стандартных интеграций. Использовать только при явном указании Wealth
            Reader.

            Позволяет проверить, является ли физическое или юридическое лицо владельцем
            определённого банковского счёта, используя IBAN и идентификационные данные
            предполагаемого владельца.

            '
        zh:
          summary: 通过IBAN验证银行账户所有权
          description: '此端点是可选的，不需要用于标准集成。仅在Wealth Reader明确指示时使用。

            允许使用IBAN和声称持有人的身份数据验证自然人或法人是否是特定银行账户的持有人。

            '
        ja:
          summary: IBANによる銀行口座所有権の確認
          description: 'このエンドポイントはオプションであり、標準統合には必要ありません。Wealth Readerが明示的に指示した場合にのみ使用してください。


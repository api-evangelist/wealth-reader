            Endpoint-urile grupate sub eticheta "batch" permit procesarea mai multor
            conexiuni bancare în mod asincron, spre deosebire de metoda `/entities/`
            care este sincronă. Ideal pentru procesarea volumelor mari de conexiuni
            și evitarea timeout-urilor.

            '
        'no':
          summary: Batch-tilkoblingslasting
          description: 'Dette endepunktet er valgfritt og ikke nødvendig for standardintegrasjoner.
            Bruk kun hvis eksplisitt instruert av Wealth Reader.

            **Viktig**: For å bruke batchprosesshåndtering på Wealthreader-siden, kreves
            et dedikert miljø. Dette endepunktet er ikke tilgjengelig på api.wealthreader.com.

            Endpoint-ene gruppert under "batch"-taggen tillater asynkron behandling
            av flere bankforbindelser, i motsetning til den synkrone `/entities/`-metoden.
            Ideell for behandling av store volumer av forbindelser og unngå timeouts.

            '
        da:
          summary: Batch-forbindelsesindlæsning
          description: 'Dette endpoint er valgfrit og ikke påkrævet for standardintegrationer.
            Brug kun hvis eksplicit instrueret af Wealth Reader.

            **Vigtigt**: For at bruge batchproceshåndtering på Wealthreader-siden kræves
            et dedikeret miljø. Dette endpoint er ikke tilgængeligt på api.wealthreader.com.

            Endpoints grupperet under "batch"-tagget tillader asynkron behandling
            af flere bankforbindelser, i modsætning til den synkrone `/entities/`
            metode. Ideel til behandling af store mængder forbindelser og undgåelse
            af timeouts.

            '
        fi:
          summary: Batch-yhteyksien lataus
          description: 'Tämä päätepiste on valinnainen eikä vaadita vakiointegraatioihin.
            Käytä vain jos Wealth Reader nimenomaisesti ohjeistaa.

            **Tärkeää**: Wealthreader-puolen eräprosessien hallinnan käyttämiseen vaaditaan
            omistettu ympäristö. Tämä päätepiste ei ole käytettävissä osoitteessa
            api.wealthreader.com.

            "batch"-tagin alla ryhmitellyt päätepisteet mahdollistavat useiden pankkiyhteyksien
            asynkronisen käsittelyn, toisin kuin synkroninen `/entities/`-menetelmä.
            Ihanteellinen suurten yhteysvolyymien käsittelyyn ja aikakatkaisujen välttämiseen.

            '
        ga:
          summary: Luchtú nasc baisc
          description: 'Tá an críochphointe seo roghnach agus ní theastaítear le haghaidh
            comhtháthaithe caighdeánacha. Bain úsáid as ach amháin má thugann Wealth
            Reader treoir shoiléir.

            **Tábhachtach**: Chun bainistiú próisis bhaisc a úsáid ar thaobh Wealthreader,
            tá timpeallacht tiomnaithe ag teastáil. Níl an críochphointe seo ar fáil ar

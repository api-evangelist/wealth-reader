                  * `compound` - Dobânda se adaugă la capital în fiecare perioadă, perioada următoare calculează dobânda pe noul total
              'no':
                description: |
                  Type rentekapitalisering:
                  * `none` - Renter utbetales til linked_account, hovedstolen forblir konstant
                  * `simple` - Renter beregnet kun på opprinnelig hovedstol, kan akkumuleres (accrued_interest) uten å generere nye renter

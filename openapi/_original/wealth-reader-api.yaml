                  * `simple` - Rente berekend op oorspronkelijke hoofdsom, kan oplopen (accrued_interest) maar genereert geen nieuwe rente
                  * `compound` - Rente wordt per periode bij hoofdsom opgeteld, volgende periode berekent rente over nieuw totaal
              ca:
                description: |
                  Tipus de capitalització d'interessos:
                  * `none` - Els interessos es liquiden a linked_account, el capital roman constant
                  * `simple` - Interessos calculats només sobre el capital original, poden acumular-se (accrued_interest) però no generen nous interessos
                  * `compound` - Els interessos s'afegeixen al capital cada període, el següent període calcula interessos sobre el nou total
              pt:
                description: |
                  Tipo de capitalização de juros:
                  * `none` - Os juros são pagos para linked_account, o capital permanece constante
                  * `simple` - Juros calculados apenas sobre o capital original, podem acumular-se (accrued_interest) mas não geram novos juros
                  * `compound` - Os juros são adicionados ao capital em cada período, o próximo período calcula juros sobre o novo total
              it:
                description: |
                  Tipo di capitalizzazione degli interessi:

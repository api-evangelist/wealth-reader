            Reader.

            **Σημαντικό**: Για να χρησιμοποιήσετε τη διαχείριση διεργασιών batch από την
            πλευρά του Wealthreader, απαιτείται αποκλειστικό περιβάλλον. Αυτό το endpoint
            δεν είναι διαθέσιμο στο api.wealthreader.com.

            Τα endpoints που ομαδοποιούνται κάτω από την ετικέτα "batch" επιτρέπουν

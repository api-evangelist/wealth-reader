            '
        da:
          summary: Liste over fejlkoder
          description: 'Liste over fejlkoder. Vær særligt opmærksom på, at ikke alle
            fejlkoder skal modtage den samme behandling fra din applikation. For en
            forkert adgangskode-fejl skal du ikke prøve kaldet igen med de samme parametre,
            men for en fejl, der indikerer, at enheden er under vedligeholdelse, kan
            du prøve igen. Anmod om en teknisk session med vores team for at løse
            eventuelle spørgsmål om fejlhåndtering.

            '
        fi:
          summary: Virhekoodiluettelo
          description: 'Virhekoodiluettelo. Kiinnitä erityistä huomiota siihen, että
            kaikkia virhekoodeja ei pitäisi käsitellä samalla tavalla sovelluksessasi.
            Väärän salasanan virheen kohdalla sinun ei pitäisi yrittää kutsua uudelleen
            samoilla parametreilla, mutta virheen kohdalla, joka osoittaa että entiteetti
            on huollossa, voit yrittää uudelleen. Pyydä teknistä istuntoa tiimimme
            kanssa ratkaistaksesi kaikki kysymykset virheenhallinnasta.

            '
        ga:
          summary: Liosta de chóid earráide
          description: 'Liosta de chóid earráide. Tabhair aird speisialta ar an bhfíric
            nach bhfuil gach cód earráide le cóir mar an gcéanna ó do fheidhmchlár.
            I gcás earráid pasfhocail mhícheart, níor cheart duit an glao a aththriail
            leis na paraiméadair chéanna, ach i gcás earráid a léiríonn go bhfuil
            an t-aonán faoi chothabháil, is féidir leat aththriail a dhéanamh. Iarr
            seisiún teicniúil lenár bhfoireann chun aon cheisteanna faoi bhainistíocht
            earráidí a réiteach.

            '
        ru:
          summary: Список кодов ошибок
          description: 'Список кодов ошибок. Обратите особое внимание на то, что не
            все коды ошибок должны обрабатываться вашим приложением одинаково. При
            ошибке неправильного пароля не следует повторять вызов с теми же параметрами,
            но при ошибке, указывающей на то, что сущность находится на обслуживании,
            можно повторить попытку. Запросите техническую сессию с нашей командой
            для решения любых вопросов по управлению ошибками.

            '
        zh:
          summary: 错误代码列表
          description: '错误代码列表。请特别注意，并非所有错误代码都应该由您的应用程序以相同方式处理。对于密码错误，您不应该使用相同的参数重试调用，但对于指示实体正在维护的错误，您可以重试。请与我们的团队请求技术会议，以解决有关错误管理的任何问题。

            '
        ja:
          summary: エラーコードのリスト
          description: 'エラーコードのリスト。すべてのエラーコードがアプリケーションで同じ扱いを受けるべきではないことに特に注意してください。パスワードが間違っているエラーの場合、同じパラメータで呼び出しを再試行すべきではありませんが、エンティティがメンテナンス中であることを示すエラーの場合は、再試行できます。エラー管理に関するご質問は、当社チームとの技術セッションをリクエストしてください。

            '

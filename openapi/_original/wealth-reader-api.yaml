- name: Cards (real time)
  description: 'Real-time card expense synchronization from the Open Sync mobile app:
    per-customer employee pre-registration, signed webhooks (card_transaction.created
    / card_enrollment.confirmed), and REST query / backfill.

    '
  x-i18n:
    es:
      description: 'Sincronización de gastos de tarjeta en tiempo real desde la app
        móvil Open Sync: pre-registro de empleados por cliente, webhooks firmados
        (card_transaction.created / card_enrollment.confirmed), y consulta / backfill
        por API REST.

        '
paths:
  /entities/:
    post:
      tags:
      - Core
      summary: Retrieves financial assets and their composition details
      description: 'Retrieves financial assets and details of their composition including
        investment portfolios (stocks, funds, bonds, pension plans, alternative investments,
        crypto), credit cards, insurance, and loans. Includes ownership information for each asset as well as unique
        identifiers that facilitate data processing. It is possible to obtain Mock
        data. Check with the technical team on how to do this.

        '
      x-i18n:
        es:
          summary: Obtiene los activos financieros y el detalle de su composición
          description: 'Obtiene los activos financieros y el detalle de su composición
            de carteras de inversión (acciones, fondos, bonos, planes de pensiones,
            inversiones alternativas, criptoactivos), tarjetas de crédito, seguros
            y préstamos. Incluye información de titularidad de cada
            uno de los activos así como identificadores únicos que facilitan el tratamiento
            del dato. Es posible obtener datos Mock. Consulte con el equipo técnico
            cómo hacerlo.

            '
        fr:
          summary: Récupère les actifs financiers et les détails de leur composition
          description: 'Récupère les actifs financiers et les détails de leur composition
            incluant les portefeuilles d''investissement composés d''actions ou de
            fonds, cartes de crédit, assurances et prêts. Inclut les informations
            de propriété pour chaque actif ainsi que des identifiants uniques qui
            facilitent le traitement des données. Il est possible d''obtenir des données
            Mock. Vérifiez auprès de l''équipe technique comment procéder.

            '
        de:
          summary: Ruft Finanzanlagen und deren Zusammensetzungsdetails ab
          description: 'Ruft Finanzanlagen und Details ihrer Zusammensetzung ab, einschließlich
            Investmentportfolios bestehend aus Aktien oder Fonds, Kreditkarten, Versicherungen
            und Darlehen. Enthält Eigentumsinformationen für jedes Asset sowie eindeutige
            Kennungen, die die Datenverarbeitung erleichtern. Es ist möglich, Mock-Daten
            zu erhalten. Erkundigen Sie sich beim technischen Team, wie das geht.

            '
        nl:
          summary: Haalt financiële activa en details van hun samenstelling op
          description: 'Haalt financiële activa en details van hun samenstelling op,
            inclusief beleggingsportefeuilles samengesteld uit aandelen of fondsen,
            creditcards, verzekeringen en leningen. Bevat eigendomsinformatie voor
            elk actief en unieke identificatoren die gegevensverwerking vergemakkelijken.
            Het is mogelijk om Mock-gegevens te verkrijgen. Controleer bij het technische
            team hoe dit te doen.

            '
        ca:
          summary: Obté els actius financers i el detall de la seva composició
          description: 'Obté els actius financers i el detall de la seva composició
            de carteres d''inversió compostes per accions o fons, targetes de crèdit,
            assegurances i préstecs. Inclou informació de titularitat de cadascun
            dels actius així com identificadors únics que faciliten el tractament
            de la dada. És possible obtenir dades Mock. Consulteu amb l''equip tècnic
            com fer-ho.

            '
        pt:
          summary: Obtém ativos financeiros e detalhes de sua composição
          description: 'Obtém ativos financeiros e detalhes de sua composição incluindo
            carteiras de investimento compostas por ações ou fundos, cartões de crédito,
            seguros e empréstimos. Inclui informações de propriedade para cada ativo
            bem como identificadores únicos que facilitam o processamento de dados.
            É possível obter dados Mock. Verifique com a equipe técnica como fazer
            isso.

            '
        it:
          summary: Recupera gli attivi finanziari e i dettagli della loro composizione
          description: 'Recupera gli attivi finanziari e i dettagli della loro composizione
            inclusi portafogli di investimento composti da azioni o fondi, carte di
            credito, assicurazioni e prestiti. Include informazioni di proprietà per
            ciascun attivo nonché identificatori unici che facilitano l''elaborazione
            dei dati. È possibile ottenere dati Mock. Verifica con il team tecnico
            come farlo.

            '
        el:
          summary: Ανάκτηση χρηματοοικονομικών περιουσιακών στοιχείων και λεπτομερών
            στοιχείων της σύνθεσής τους
          description: 'Ανάκτηση χρηματοοικονομικών περιουσιακών στοιχείων και λεπτομερών
            στοιχείων της σύνθεσής τους συμπεριλαμβανομένων χαρτοφυλακίων επενδύσεων
            αποτελούμενων από μετοχές ή αμοιβαία κεφάλαια, πιστωτικές κάρτες, ασφάλειες
            και δάνεια. Περιλαμβάνει πληροφορίες ιδιοκτησίας για κάθε περιουσιακό
            στοιχείο καθώς και μοναδικούς αναγνωριστικούς κωδικούς που διευκολύνουν
            την επεξεργασία δεδομένων. Είναι δυνατή η λήψη δεδομένων Mock. Ελέγξτε
            με την τεχνική ομάδα πώς να το κάνετε.

            '
        ro:
          summary: Preia activele financiare și detaliile compoziției acestora
          description: 'Preia activele financiare și detaliile compoziției acestora
            inclusiv portofoliile de investiții compuse din acțiuni sau fonduri, carduri
            de credit, asigurări și împrumuturi. Include informații de proprietate
            pentru fiecare activ precum și identificatori unici care facilitează procesarea
            datelor. Este posibil să se obțină date Mock. Verificați cu echipa tehnică
            cum să procedați.

            '
        'no':
          summary: Henter finansielle eiendeler og detaljer om deres sammensetning
          description: 'Henter finansielle eiendeler og detaljer om deres sammensetning
            inkludert investeringsporteføljer sammensatt av aksjer eller fond, kredittkort,
            forsikringer og lån. Inkluderer eierskapsinformasjon for hver eiendel
            samt unike identifikatorer som letter databehandling. Det er mulig å få
            Mock-data. Sjekk med det tekniske teamet hvordan dette gjøres.

            '
        da:
          summary: Henter finansielle aktiver og detaljer om deres sammensætning
          description: 'Henter finansielle aktiver og detaljer om deres sammensætning
            inklusive investeringsporteføljer sammensat af aktier eller fonde, kreditkort,
            forsikringer og lån. Inkluderer ejerskabsoplysninger for hver aktiv samt
            unikke identifikatorer, der letter databehandling. Det er muligt at få
            Mock-data. Tjek med det tekniske team hvordan dette gøres.

            '
        fi:
          summary: Hakee taloudelliset varat ja niiden koostumustiedot
          description: 'Hakee taloudelliset varat ja niiden koostumustiedot mukaan
            lukien sijoitussalkut koostuen osakkeista tai rahastoista, luottokortit,
            vakuutukset ja lainat. Sisältää omistustiedot jokaiselle varalle sekä
            yksilölliset tunnisteet, jotka helpottavat tietojen käsittelyä. On mahdollista
            saada Mock-tietoja. Tarkista tekniseltä tiimiltä miten tämä tehdään.

            '
        ga:
          summary: Faigheann sé sócmhainní airgeadais agus sonraí a gcomhdhéana
          description: 'Faigheann sé sócmhainní airgeadais agus sonraí a gcomhdhéana
            lena n-áirítear punanna infheistíochta comhdhéanta de stoic nó cistí,
            cártaí creidmheasa, árachais agus iasachtaí. Áiríonn sé faisnéis úinéireachta
            do gach sócmhainn chomh maith le haitheantóirí uathúla a éascaíonn próiseáil
            sonraí. Is féidir sonraí Mock a fháil. Seiceáil leis an bhfoireann theicniúil
            conas é seo a dhéanamh.

            '
        ru:
          summary: Получает финансовые активы и детали их состава
          description: 'Получает финансовые активы и детали их состава, включая инвестиционные
            портфели, состоящие из акций или фондов, кредитные карты, страховки и
            кредиты. Включает информацию о собственности для каждого актива, а также
            уникальные идентификаторы, которые облегчают обработку данных. Возможно
            получение Mock-данных. Проверьте у технической команды, как это сделать.

            '
        zh:
          summary: 检索金融资产及其组成详情
          description: '检索金融资产及其组成详情，包括由股票或基金组成的投资组合、信用卡、保险和贷款。包括每个资产的所有权信息以及便于数据处理的唯一标识符。可以获取Mock数据。请咨询技术团队如何操作。

            '
        ja:
          summary: 金融資産とその構成詳細を取得します
          description: '株式またはファンドで構成された投資ポートフォリオ、クレジットカード、保険、融資を含む金融資産とその構成詳細を取得します。各資産の所有権情報とデータ処理を容易にする一意の識別子が含まれます。Mockデータを取得することが可能です。技術チームに方法を確認してください。

            '

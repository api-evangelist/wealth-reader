                        выбора пользователя. Пример ниже ориентировочный;
                        всегда копируйте строку из statistics.otpMethods для вашей организации.'
                    zh:
                      description: 当API返回错误码2017或20171（多种OTP方式）时，用于选择二次验证投递渠道。请使用同一响应中的会话标识再次调用，并将otp_method设为statistics.otpMethods中某一对象的otp_method字段的完整字符串——不要使用数组下标。首次凭据请求可省略；用户选择方式后必填。下方示例仅供参考；请始终复制statistics.otpMethods中返回的字符串。
                    ja:
                      description: APIがエラーコード2017または20171（複数のOTP方式）を返したときに、どの第二要素配信チャネルを使うかを指定します。その応答と同じセッション識別子で再呼び出しし、statistics.otpMethods内のいずれかのオブジェクトのotp_methodフィールドの文字列を完全一致で設定します（配列インデックス不可）。初回のクレデンシャル要求では省略可能。ユーザー選択後に送信。下の例は参考用です。常にstatistics.otpMethodsで返された文字列をそのまま使用してください。

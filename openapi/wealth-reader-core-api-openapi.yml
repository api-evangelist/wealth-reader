    deposits:
      type: array
      items:
        type: object
        description: Fixed-term deposits
        required:
        - uuid
        - code
        - name
        - currency
        - principal
        - start_date
        - maturity_date
        - rate_type
        - nominal_interest_rate
        - owners
        - status
        - interest_movements
        properties:
          uuid:
            type: string
            description: Unique identifier, in relation to the user, assigned by Wealth Reader
            example: 0ae4d722b1c82feeafb4b36b2893230444071335
          code:
            type: string
            description: Bank's internal identifier (contract/deposit)
            example: DPZ-1234567890
          name:
            type: string
            example: 12-month deposit
          currency:
            type: string
            example: EUR
          principal:
            type: number
            description: Contracted nominal amount
            example: 10000
          pending_principal:
            type: number
            description: Remaining nominal amount to be repaid
            example: 5000
          start_date:
            type: string
            format: date
            example: '2024-09-01'
          maturity_date:
            type: string
            format: date
            example: '2025-09-01'
          payment_frequency:
            type: string
            enum:
            - monthly
            - quarterly
            - semiannual
            - annual
            - at_maturity
            description: Interest payment frequency, if provided by the entity
            example: at_maturity
          capitalization:
            type: string
            enum:
            - none
            - simple
            - compound
            description: 'Interest capitalization type:

              * `none` - Interest is paid out to linked_account, principal stays constant

              * `simple` - Interest calculated on original principal only, may accrue (accrued_interest) but does not generate further interest

              * `compound` - Interest added to principal at each period, next period''s interest calculated on the new total

              '
            example: none
          rate_type:
            type: string
            enum:
            - fixed
            - variable
            example: fixed
          nominal_interest_rate:
            type: number
            description: Nominal interest rate (NIR) for the entire period, if applicable
            example: 3
          apr_tae:
            type: number
            description: Annual Percentage Rate (APR/TAE); if the entity provides TAE, return it here
            example: 3.04
          day_count_convention:
            type: string
            enum:
            - ACT/360
            - ACT/365
            - 30E/360
            - ACT/ACT
            description: Day count convention, if available
            example: ACT/365
          linked_account:
            type: string
            description: IBAN where interests or principal are credited at maturity
            example: ES4021005321592566566159
          accrued_interest:
            type: number
            description: Accrued unpaid interest as of the extraction date
            example: 24.58
          expected_interest_total:
            type: number
            description: Expected gross interest at maturity (if the entity calculates it)
            example: 300
          withholding_tax_rate:
            type: number
            description: Withholding tax rate applied to interest, if reported by the entity
            example: 19
          status:
            type: string
            enum:
            - active
            - matured
            - cancelled
            - early_redeemed
            example: active
          auto_renewal:
            type: object
            description: Auto-renewal information
            properties:
              enabled:
                type: boolean
                example: false
              renewed_times:
                type: integer
                example: 0
              next_renewal_date:
                type:
                - string
                - 'null'
                format: date
              renewal_term_months:
                type:
                - integer
                - 'null'
          early_withdrawal:
            type: object
            description: Early withdrawal clauses (if reported by the entity)
            properties:
              allowed:
                type: boolean
                example: true
              penalty_type:
                type: string
                enum:
                - percentage
                - fixed
                - interest_loss
                - other
                example: interest_loss
              penalty_value:
                type: number
                example: 100
              notes:
                type: string
                example: Loss of accrued interest for the current period
          owners:
            $ref: '#/components/schemas/owners'
          interest_movements:
            type: array
            description: Interest payments made and/or scheduled
            items:
              type: object
              required:
              - date
              - currency
              - gross_interest
              properties:
                uuid:
                  type: string
                  description: Unique identifier, in relation to the deposit
                  example: 90763109952d4f2ebece8dceca8254078c5384a0
                scheduled:
                  type: boolean
                  description: true if scheduled (future), false if already paid
                  example: false
                date:
                  type: string
                  format: date
                  example: '2025-09-01'
                period_start:
                  type: string
                  format: date
                  description: Start of the period to which the coupon/interest corresponds
                  example: '2024-09-01'
                period_end:
                  type: string
                  format: date
                  example: '2025-09-01'
                currency:
                  type: string
                  example: EUR
                gross_interest:
                  type: number
                  example: 300
                withholding_tax:
                  type: number
                  example: 57
                net_interest:
                  type: number
                  example: 243
                payment_type:
                  type: string
                  enum:
                  - coupon
                  - maturity
                  example: maturity
          principal_movements:
            type: array
            description: Principal movements - opening, renewal, cancellation, reimbursement
            items:
              type: object
              properties:
                uuid:
                  type: string
                  description: Unique identifier, in relation to the deposit
                  example: 90763109952d4f2ebece8dceca8254078c5384a0
                date:
                  type: string
                  format: date
                type:
                  type: string
                  enum:
                  - opening
                  - renewal
                  - maturity_payout
                  - early_redemption
                amount:
                  type: number
                  example: 12000
                  minimum: 0
                  description: It is always an absolute value. The sign is defined by type
                currency:
                  type: string
                target_account:
                  type: string
                  description: Destination account when principal is reimbursed
    portfolio_crypto:
      allOf:
      - $ref: '#/components/schemas/portfolio_common'
      - type: object
        properties:
          subtype:
            type: string
            enum:
            - crypto
            example: crypto
          composition:
            $ref: '#/components/schemas/portfolio_composition_crypto'
    error-detail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: unsigned
          example: 1000
          description: The code indicates the error family. For example, from 2000 to 2999 indicate login problems. Each error code should be treated differently. For example, if the code indicates 'Incorrect login', the call should not be retried; if the code indicates 'entity under maintenance' it can be retried later. You can get the complete list in the error-codes method.
        message:

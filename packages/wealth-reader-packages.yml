note: >-
  Wealth Reader publishes NO client library for the bank-aggregation API itself. Integration is by
  the hosted iframe widget (see components/) or by direct form-encoded HTTP, and the docs offer a
  Postman collection instead of an SDK. The one first-party package is allwr-toolkit, an Apache-2.0
  Python toolkit for ALL WR — the company's Open Finance and business-operations platform on
  allwr.io — which carries a typed ALL WR API client, a CLI and an MCP server. It is not published
  to PyPI yet (pyproject says "once published"; pypi.org/pypi/allwr-toolkit/json returns 404), so
  the only distribution today is `pip install .` from source. Because no package wraps the
  Wealth Reader API, no `SDKs` pointer is emitted; the CLI and MCP pointers are.

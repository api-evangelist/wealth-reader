conformance:
- id: psd2
  conforms: true
  evidence: >-
    Wealth Reader is authorised by the Banco de España to provide the account information service
    (AIS) under PSD2 — stated on https://www.wealthreader.com/en/about-wealth-reader/ ("a company
    authorised by the Bank of Spain to provide the account information service (AIS PSD2)") and
    repeated on the pricing page as "Regulated by the Bank of Spain". The API is read-only and
    never initiates payments, which is exactly the AISP scope.
  role: AISP (account information service provider)
  note: >-
    PSD2 is a channel here, not the whole product. The company's differentiator is the SECOND,
    non-PSD2 channel that returns wealth data the regulatory APIs do not expose — investment
    portfolio composition, ISIN and DGS codes, insurance, leases.
- id: psd2-channel-declared-in-contract
  conforms: true
  domain_standard: true
  evidence: >-
    The institution catalogue served at GET https://api.wealthreader.com/entities/ carries a
    per-institution `psd2` field — "1" regulatory PSD2 channel, "0" non-PSD2 channel — and the
    widget accepts `psd2` and `nonpsd2` booleans to filter the selector by channel. The regulatory
    regime is therefore a first-class, machine-readable attribute of every institution in the
    contract, not a claim on a marketing page. A consumer can tell, per bank, which legal channel
    the data came over before requesting it.
  spec_location: 'GET /entities/ response, per-entity `psd2` property; wr_conf psd2 / nonpsd2 flags'
- id: iso-6166-isin
  conforms: true
  domain_standard: true
  evidence: >-
    ISIN is a declared property on the portfolio composition schemas in the published OpenAPI —
    portfolio_composition_funds_item, portfolio_composition_stocks_item,
    portfolio_composition_pension_plans_item and portfolio_composition_bonds_item each carry an
    `ISIN` field described as "Instrument ISIN", alongside ISIN_description. Obtaining ISIN codes
    is also sold as a named product
    (https://www.wealthreader.com/en/products/obtaining-isin-and-dgs-codes/).
  spec_location: components.schemas.portfolio_composition_*_item.ISIN
  why_it_matters: >-
    A consumer that already speaks ISIN can join these positions to any market-data source with no
    bespoke mapping. This is the single most valuable standard declaration in the contract.
- id: iso-13616-iban
  conforms: true
  domain_standard: true
  evidence: >-
    Account identifiers are returned as IBAN in the accounts schema (`code`, e.g.
    ES4914651234561234567890) and IBAN is the required input to POST /verify/iban-ownership/,
    which verifies account holder identity against an IBAN plus a national document number.
  spec_location: 'components.schemas.accounts; POST /verify/iban-ownership/ requestBody.iban'
- id: iso-9362-bic
  conforms: true
  domain_standard: true
  evidence: >-
    The institution catalogue returns a `bic` field (BIC/SWIFT) per institution when one exists —
    documented in api-reference/institutions.md and present in the live response from
    GET https://api.wealthreader.com/entities/.
  spec_location: 'GET /entities/ response, per-entity `bic` property'
- id: iso-3166-country-codes
  conforms: true
  evidence: >-
    Institutions carry `country_code` and `country_code_list` as ISO country codes; the widget's
    default_login_entity_country takes an ISO country code.
- id: dgs-codes
  conforms: true
  domain_standard: true
  evidence: >-
    Deposit Guarantee Scheme codes are a named published product
    (https://www.wealthreader.com/en/products/obtaining-isin-and-dgs-codes/) delivered alongside
    ISIN on portfolio positions.
  note: >-
    DGS identification is a European regulatory construct (Directive 2014/49/EU). Recorded as a
    domain-standard signal, though the identifier scheme itself is not a single ISO registry.
- id: iso-27001
  conforms: true
  evidence: >-
    "ISO 27001 certified by AENOR" — stated on https://www.wealthreader.com/en/pricing/ in the
    trust band alongside "Regulated by the Bank of Spain", "Infrastructure hosted in the European
    Union" and "Support from Spain". AENOR is the Spanish national standards body.
  certificate_published: false
  certificate_note: >-
    The claim is published; the certificate itself is not linked and there is no trust centre page

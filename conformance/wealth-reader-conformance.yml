- id: gdpr
  conforms: true
  evidence: >-
    Privacy policy published at https://www.wealthreader.com/es/politica-privacidad/ (HTTP 200; the
    page is a thin HTML wrapper embedding a Google Doc). EU-resident infrastructure is stated on
    the pricing page. Handling personal financial data as a Spanish AISP puts them squarely in
    scope.
  note: The policy is Spanish-only and is not served as a first-class page on the site.
- id: oauth2
  conforms: false
  evidence: >-
    An OAuth-shaped authorization-code + PKCE flow exists at https://oauth.wealthreader.com/oauth2/
    with a token exchange at /token/, but it does not conform. Parameter names deviate from RFC
    7636 (`challenge_code` rather than `code_challenge`), no scopes are defined, and there is no
    discovery: /.well-known/oauth-authorization-server returned 404 on both
    www.wealthreader.com and api.wealthreader.com on 2026-09-03. A standard OAuth client cannot be
    pointed at it.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returned 404 on both hosts, probed 2026-09-03.
- id: rfc9457
  conforms: false
  evidence: >-
    Errors use a bespoke envelope — {success, error:{code, message}, statistics} with integer codes
    and a `fatal` flag — served as application/json. No application/problem+json anywhere in the
    contract. See errors/wealth-reader-problem-types.yml.
  note: >-
    The catalogue itself is unusually good — 40 codes and 14 warning codes served LIVE and
    machine-readable at /error-codes/ and /warning-codes/, each with a cause, a remediation and a
    retry-safety flag. It is simply not in the standard shape.
- id: rfc8594-sunset
  conforms: false
